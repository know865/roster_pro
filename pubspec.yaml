name: roster_pro
description: Roster Pro v7.0 - 排更日曆 支援真ID Google日曆同步(記同步記事)、全天核實、轉盤時間、長按編輯、左右滑月份、每年假期自動更新、截圖分享放大字體、全部備份路徑顯示
publish_to: 'none'
version: 7.0.0+70

environment:
  sdk: ">=3.2.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  intl: ^0.19.0
  shared_preferences: ^2.3.3
  file_picker: ^8.0.0
  path_provider: ^2.1.5
  device_calendar: ^4.3.3
  timezone: ^0.9.2
  permission_handler: ^11.3.1
  share_plus: ^8.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
