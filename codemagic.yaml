workflows:
  android-roster-pro-v71-9fix:
    name: Roster Pro v7.1 9Fix - Android APK
    max_build_duration: 60
    instance_type: mac_mini_m1
    environment:
      flutter: 3.24.5
      java: 17
      groups:
        - keystore_credentials
    scripts:
      - name: Set up Flutter
        script: |
          flutter --version
          flutter clean
          flutter pub get

      - name: Rebuild Android Skeleton
        script: |
          echo "=== 備份重要檔案 ==="
          cp lib/main.dart /tmp/main.dart.bak
          cp pubspec.yaml /tmp/pubspec.yaml.bak

          echo "=== 刪除舊 android 目錄 ==="
          rm -rf android

          echo "=== flutter create 重建骨架 ==="
          flutter create --platforms=android --org com.example --project-name roster_pro --no-pub .

          echo "=== 還原重要檔案 ==="
          cp /tmp/main.dart.bak lib/main.dart
          cp /tmp/pubspec.yaml.bak pubspec.yaml

          echo "=== 檢查關鍵檔案 ==="
          ls -la android/build.gradle
          ls -la android/settings.gradle
          ls -la android/app/build.gradle
          ls -la android/app/src/main/AndroidManifest.xml

      - name: Add Custom Widget Files
        script: |
          set -e

          echo "=== 覆寫 AndroidManifest.xml ==="
          cat > android/app/src/main/AndroidManifest.xml <<'MANIFEST_EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET"/>
              <uses-permission android:name="android.permission.READ_CALENDAR" />
              <uses-permission android:name="android.permission.WRITE_CALENDAR" />
              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" />
              <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" />
              <uses-permission android:name="android.permission.MANAGE_EXTERNAL_STORAGE" />

              <application
                  android:label="Roster Pro"
                  android:name="${applicationName}"
                  android:icon="@mipmap/ic_launcher"
                  android:requestLegacyExternalStorage="true">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTop"
                      android:theme="@style/LaunchTheme"
                      android:configChanges="orientation|keyboardHidden|keyboard|screenSize|smallestScreenSize|locale|layoutDirection|fontScale|screenLayout|density|uiMode"
                      android:hardwareAccelerated="true"
                      android:windowSoftInputMode="adjustResize">
                      <meta-data
                          android:name="io.flutter.embedding.android.NormalTheme"
                          android:resource="@style/NormalTheme" />
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>

                  <meta-data
                      android:name="flutterEmbedding"
                      android:value="2" />

                  <receiver android:name=".RosterWidgetProvider" android:exported="false">
                      <intent-filter>
                          <action android:name="android.appwidget.action.APPWIDGET_UPDATE" />
                          <action android:name="PREV_MONTH" />
                          <action android:name="NEXT_MONTH" />
                          <action android:name="REFRESH_WIDGET" />
                      </intent-filter>
                      <meta-data android:name="android.appwidget.provider" android:resource="@xml/widget_info" />
                  </receiver>
              </application>

              <queries>
                  <intent>
                      <action android:name="android.intent.action.PROCESS_TEXT"/>
                      <data android:mimeType="text/plain"/>
                  </intent>
              </queries>
          </manifest>
          MANIFEST_EOF

          echo "=== 建立 MainActivity.kt ==="
          mkdir -p android/app/src/main/kotlin/com/example/roster_pro
          cat > android/app/src/main/kotlin/com/example/roster_pro/MainActivity.kt <<'MAIN_EOF'
          package com.example.roster_pro

          import android.Manifest
          import android.content.Intent
          import android.content.pm.PackageManager
          import android.media.MediaScannerConnection
          import android.net.Uri
          import android.os.Build
          import android.os.Environment
          import android.provider.CalendarContract
          import android.provider.Settings
          import androidx.core.content.ContextCompat
          import io.flutter.embedding.android.FlutterActivity
          import io.flutter.embedding.engine.FlutterEngine
          import io.flutter.plugin.common.MethodChannel
          import java.io.File

          class MainActivity : FlutterActivity() {
              private val CHANNEL = "com.roster/calendar_real"

              override fun configureFlutterEngine(flutterEngine: FlutterEngine) {
                  super.configureFlutterEngine(flutterEngine)
                  MethodChannel(flutterEngine.dartExecutor.binaryMessenger, CHANNEL).setMethodCallHandler { call, result ->
                      when (call.method) {
                          "getCalendars" -> handleGetCalendars(result)
                          "scanImage" -> handleScanImage(call.argument<String>("path"), result)
                          "requestManageStorage" -> handleRequestManageStorage(result)
                          else -> result.notImplemented()
                      }
                  }
              }

              private fun handleGetCalendars(result: MethodChannel.Result) {
                  if (ContextCompat.checkSelfPermission(this, Manifest.permission.READ_CALENDAR) != PackageManager.PERMISSION_GRANTED) {
                      result.error("PERMISSION", "No calendar permission", null)
                      return
                  }
                  val calendars = mutableListOf<Map<String, Any?>>()
                  val uri = CalendarContract.Calendars.CONTENT_URI
                  val projection = arrayOf(
                      CalendarContract.Calendars._ID,
                      CalendarContract.Calendars.CALENDAR_DISPLAY_NAME,
                      CalendarContract.Calendars.ACCOUNT_NAME,
                      CalendarContract.Calendars.ACCOUNT_TYPE
                  )
                  val cursor = contentResolver.query(uri, projection, null, null, null)
                  cursor?.use {
                      while (it.moveToNext()) {
                          val id = it.getLong(0).toString()
                          val displayName = it.getString(1) ?: "Unnamed"
                          val accountName = it.getString(2) ?: ""
                          val accountType = it.getString(3) ?: ""
                          val isGoogle = accountName.contains("gmail") || accountType.contains("google") || accountName.contains("google")
                          calendars.add(mapOf(
                              "id" to id,
                              "displayName" to displayName,
                              "accountName" to accountName,
                              "accountType" to accountType,
                              "isGoogle" to isGoogle
                          ))
                      }
                  }
                  result.success(calendars)
              }

              private fun handleScanImage(path: String?, result: MethodChannel.Result) {
                  if (path == null) {
                      result.error("NO_PATH", "Path is null", null)
                      return
                  }
                  try {
                      val file = File(path)
                      if (!file.exists()) {
                          result.error("NO_FILE", "File does not exist: $path", null)
                          return
                      }
                      MediaScannerConnection.scanFile(
                          applicationContext,
                          arrayOf(file.absolutePath),
                          arrayOf("image/jpeg", "image/jpg", "image/png")
                      ) { _, uri ->
                          result.success(uri?.toString() ?: path)
                      }
                  } catch (e: Exception) {
                      result.error("SCAN_FAIL", e.message, null)
                  }
              }

              private fun handleRequestManageStorage(result: MethodChannel.Result) {
                  try {
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.R) {
                          if (!Environment.isExternalStorageManager()) {
                              val intent = Intent(Settings.ACTION_MANAGE_APP_ALL_FILES_ACCESS_PERMISSION)
                              intent.data = Uri.parse("package:$packageName")
                              startActivity(intent)
                              result.success(false)
                              return
                          }
                          result.success(true)
                      } else {
                          result.success(true)
                      }
                  } catch (e: Exception) {
                      result.error("STORAGE_FAIL", e.message, null)
                  }
              }
          }
          MAIN_EOF

          echo "=== 建立 widget_info.xml ==="
