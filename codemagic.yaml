          class RosterWidgetProvider : AppWidgetProvider() {

              override fun onUpdate(context: Context, appWidgetManager: AppWidgetManager, appWidgetIds: IntArray) {
                  for (appWidgetId in appWidgetIds) {
                      try { updateAppWidget(context, appWidgetManager, appWidgetId) } catch (e: Exception) {}
                  }
              }

              override fun onAppWidgetOptionsChanged(context: Context, appWidgetManager: AppWidgetManager, appWidgetId: Int, newOptions: android.os.Bundle) {
                  super.onAppWidgetOptionsChanged(context, appWidgetManager, appWidgetId, newOptions)
                  try { updateAppWidget(context, appWidgetManager, appWidgetId) } catch (e: Exception) {}
              }

              override fun onReceive(context: Context, intent: Intent) {
                  super.onReceive(context, intent)
                  val action = intent.action ?: return
                  if (action == "PREV_MONTH" || action == "NEXT_MONTH" || action == "REFRESH_WIDGET") {
                      try {
                          val appWidgetManager = AppWidgetManager.getInstance(context)
                          val thisWidget = android.content.ComponentName(context, RosterWidgetProvider::class.java)
                          val allWidgetIds = appWidgetManager.getAppWidgetIds(thisWidget)
                          val prefs = context.getSharedPreferences("widget_prefs", Context.MODE_PRIVATE)
                          var year = prefs.getInt("year", Calendar.getInstance().get(Calendar.YEAR))
                          var month = prefs.getInt("month", Calendar.getInstance().get(Calendar.MONTH))
                          if (action == "PREV_MONTH") { month--; if (month < 0) { month = 11; year-- } }
                          else if (action == "NEXT_MONTH") { month++; if (month > 11) { month = 0; year++ } }
                          prefs.edit().putInt("year", year).putInt("month", month).apply()
                          for (appWidgetId in allWidgetIds) {
                              try { updateAppWidget(context, appWidgetManager, appWidgetId) } catch (e: Exception) {}
                          }
                      } catch (e: Exception) {}
                  }
              }

              companion object {
                  private const val TAG = "RosterWidget"

                  private fun writeDebugLog(context: Context, message: String) {
                      try {
                          val timestamp = SimpleDateFormat("yyyy-MM-dd HH:mm:ss", Locale.getDefault()).format(Date())
                          val line = "[$timestamp][Kotlin] $message\n"
                          try {
                              val dir = context.getExternalFilesDir(null)
                              if (dir != null) {
                                  if (!dir.exists()) dir.mkdirs()
                                  val file = File(dir, "roster_widget_debug.txt")
                                  file.appendText(line)
                                  if (file.length() > 200 * 1024) file.writeText("[$timestamp] (log reset)\n")
                              }
                          } catch (e: Exception) {}
                      } catch (e: Exception) {}
                  }

                  private fun getValueAsInt(sp: SharedPreferences, key: String, def: Int): Int {
                      return try {
                          val v = sp.all[key]
                          val result = when (v) {
                              null -> def
                              is Int -> v
                              is Long -> v.toInt()
                              is Double -> v.toLong().toInt()
                              is Float -> v.toInt()
                              is String -> v.toLongOrNull()?.toInt() ?: v.toIntOrNull() ?: def
                              else -> def
                          }
                          if ((result ushr 24) != 0) result else def
                      } catch (e: Exception) { def }
                  }

                  private fun dpToPx(context: Context, dp: Int): Int {
                      return (dp * context.resources.displayMetrics.density).toInt()
                  }

                  private fun createRoundedRectBitmap(context: Context, width: Int, height: Int, color: Int, radius: Float): Bitmap {
                      val bitmap = Bitmap.createBitmap(width, height, Bitmap.Config.ARGB_8888)
                      val canvas = Canvas(bitmap)
                      val paint = Paint().apply {
                          isAntiAlias = true
                          this.color = color
                      }
                      val rectF = RectF(0f, 0f, width.toFloat(), height.toFloat())
                      canvas.drawRoundRect(rectF, radius, radius, paint)

                      val highlightPaint = Paint().apply {
                          isAntiAlias = true
                          this.color = 0x55FFFFFF
                          style = Paint.Style.STROKE
                          strokeWidth = dpToPx(context, 1).toFloat()
                      }
                      canvas.drawRoundRect(rectF, radius, radius, highlightPaint)

                      val shadowPaint = Paint().apply {
                          isAntiAlias = true
                          this.color = 0x55000000
                          style = Paint.Style.STROKE
                          strokeWidth = dpToPx(context, 1).toFloat()
                      }
                      val shadowRect = RectF(0f, 1f, width.toFloat(), height.toFloat())
                      canvas.drawRoundRect(shadowRect, radius, radius, shadowPaint)

                      return bitmap
                  }

                  fun updateAppWidget(context: Context, appWidgetManager: AppWidgetManager, appWidgetId: Int) {
                      val views = RemoteViews(context.packageName, R.layout.widget_layout)
                      try {
                          val widgetPrefs = context.getSharedPreferences("widget_prefs", Context.MODE_PRIVATE)
                          val homeWidgetPrefs = context.getSharedPreferences("HomeWidgetPreferences", Context.MODE_PRIVATE)
                          val flutterPrefs = context.getSharedPreferences("FlutterSharedPreferences", Context.MODE_PRIVATE)

                          val cal = Calendar.getInstance()
                          val year = widgetPrefs.getInt("year", cal.get(Calendar.YEAR))
                          val month = widgetPrefs.getInt("month", cal.get(Calendar.MONTH))
                          val monthNames = arrayOf("1月","2月","3月","4月","5月","6月","7月","8月","9月","10月","11月","12月")

                          // 強制背景為白色
                          val bgColor = 0xFFFFFFFF.toInt()
                          val todayBgColor = 0xFFFFFFFF.toInt()

                          var rosterJsonStr = homeWidgetPrefs.getString("roster_json", "") ?: ""
                          if (rosterJsonStr.isEmpty()) rosterJsonStr = flutterPrefs.getString("flutter.roster_json", "{}") ?: "{}"
                          var defsJsonStr = homeWidgetPrefs.getString("defs_json", "") ?: ""
                          if (defsJsonStr.isEmpty()) defsJsonStr = flutterPrefs.getString("flutter.defs_json", "{}") ?: "{}"
                          var lunarJsonStr = homeWidgetPrefs.getString("lunar_json", "") ?: ""
                          if (lunarJsonStr.isEmpty()) lunarJsonStr = flutterPrefs.getString("flutter.lunar_json", "{}") ?: "{}"

                          val rosterJson = try { JSONObject(rosterJsonStr) } catch (e: Exception) { JSONObject() }
                          val defsJson = try { JSONObject(defsJsonStr) } catch (e: Exception) { JSONObject() }
                          val lunarJson = try { JSONObject(lunarJsonStr) } catch (e: Exception) { JSONObject() }

                          views.setTextViewText(R.id.tv_month_title, "${year}年${monthNames[month]}")
                          views.setTextColor(R.id.tv_month_title, 0xFF333333.toInt())
                          views.setTextViewTextSize(R.id.tv_month_title, TypedValue.COMPLEX_UNIT_SP, 24f)

                          val calendar = Calendar.getInstance()
                          calendar.set(year, month, 1)
                          val firstDayOfWeek = calendar.get(Calendar.DAY_OF_WEEK)
                          val startOffset = if (firstDayOfWeek == Calendar.SUNDAY) 6 else firstDayOfWeek - 2
                          val todayStr = SimpleDateFormat("yyyy-MM-dd", Locale.getDefault()).format(Date())
                          val paleTextColor = 0xFFB0B0B0.toInt()
                          val weekFormat = SimpleDateFormat("ww", Locale.UK)

                          for (i in 0 until 35) {
                              val dayNumId = context.resources.getIdentifier("dayNum$i", "id", context.packageName)
                              val shiftId = context.resources.getIdentifier("shift$i", "id", context.packageName)
                              val shiftBgId = context.resources.getIdentifier("shift_bg$i", "id", context.packageName)
                              val lunarId = context.resources.getIdentifier("lunar$i", "id", context.packageName)
                              val cellId = context.resources.getIdentifier("cell$i", "id", context.packageName)

                              if (dayNumId == 0) continue

                              val cellCal = Calendar.getInstance()
                              cellCal.set(year, month, 1)
                              cellCal.add(Calendar.DAY_OF_MONTH, i - startOffset)
                              val cellYear = cellCal.get(Calendar.YEAR)
                              val cellMonth = cellCal.get(Calendar.MONTH)
                              val cellDay = cellCal.get(Calendar.DAY_OF_MONTH)
                              val isCurrMonth = (cellMonth == month && cellYear == year)

                              val dateStr = String.format("%04d-%02d-%02d", cellYear, cellMonth + 1, cellDay)
                              val shiftCode = rosterJson.optString(dateStr, "")
                              val lunarText = lunarJson.optString(dateStr, "")

                              views.setTextViewText(dayNumId, cellDay.toString())
                              views.setTextColor(dayNumId, if (isCurrMonth) 0xFF000000.toInt() else paleTextColor)
                              views.setTextViewTextSize(dayNumId, TypedValue.COMPLEX_UNIT_SP, 18f)
                              views.setViewVisibility(dayNumId, View.VISIBLE)

                              // 班次膠囊設計
                              if (shiftId != 0 && shiftBgId != 0) {
                                  if (shiftCode.isNotEmpty()) {
                                      views.setTextViewText(shiftId, shiftCode)
                                      var chipColor = 0xFF4CAF50.toInt()
                                      val defObj = defsJson.optJSONObject(shiftCode)
                                      if (defObj != null) {
                                          val c = defObj.optLong("color", 0).toInt()
                                          if (c != 0) chipColor = c
                                      }

                                      // 字體放大防溢出邏輯
                                      var shiftTextSize = 22f
                                      if (shiftCode.length > 2) {
                                          shiftTextSize = 14f
                                      }
                                      views.setTextViewTextSize(shiftId, TypedValue.COMPLEX_UNIT_SP, shiftTextSize)

                                      // 動態生成立體膠囊
                                      val width = dpToPx(context, 12 + shiftCode.length * 14)
                                      val height = dpToPx(context, 22)
                                      val bitmap = createRoundedRectBitmap(context, width, height, chipColor, dpToPx(context, 8).toFloat())
                                      views.setImageViewBitmap(shiftBgId, bitmap)

                                      views.setViewVisibility(shiftBgId, View.VISIBLE)
                                      views.setViewVisibility(shiftId, View.VISIBLE)
                                  } else {
                                      views.setViewVisibility(shiftBgId, View.GONE)
                                      views.setViewVisibility(shiftId, View.GONE)
                                  }
                              }

                              if (lunarId != 0) {
                                  if (lunarText.isNotEmpty()) {
                                      views.setTextViewText(lunarId, lunarText)
                                      views.setTextColor(lunarId, 0xFF888888.toInt())
                                      views.setTextViewTextSize(lunarId, TypedValue.COMPLEX_UNIT_SP, 10f)
                                      views.setViewVisibility(lunarId, View.VISIBLE)
                                  } else {
                                      views.setViewVisibility(lunarId, View.GONE)
                                  }
                              }

                              // 背景全白
                              if (cellId != 0) {
                                  views.setInt(cellId, "setBackgroundColor", bgColor)
                              }

                              // 點擊事件：綁定整個格子
                              val intent = Intent(context, MainActivity::class.java)
                              intent.putExtra("selected_date", dateStr)
                              val pi = PendingIntent.getActivity(context, appWidgetId * 1000 + i, intent, PendingIntent.FLAG_UPDATE_CURRENT or PendingIntent.FLAG_IMMUTABLE)
                              
                              if (cellId != 0) {
                                  views.setOnClickPendingIntent(cellId, pi)
                              } else {
                                  views.setOnClickPendingIntent(dayNumId, pi)
                              }
                          }

                          for (r in 0 until 5) {
                              val weekTvId = context.resources.getIdentifier("week$r", "id", context.packageName)
                              if (weekTvId != 0) {
                                  val rowFirstDay = DateTimeUtils.getDateOfIndex(year, month, r * 7, startOffset)
                                  if (rowFirstDay != null) {
                                      views.setTextViewText(weekTvId, "W${weekFormat.format(rowFirstDay)}")
                                      views.setTextColor(weekTvId, 0xFF673AB7.toInt())
                                      views.setTextViewTextSize(weekTvId, TypedValue.COMPLEX_UNIT_SP, 11f)
                                      views.setViewVisibility(weekTvId, View.VISIBLE)
                                  }
                              }
                          }

                          try { views.setInt(R.id.widget_root, "setBackgroundColor", bgColor) } catch (e: Exception) {}

                          val prevIntent = Intent(context, RosterWidgetProvider::class.java).setAction("PREV_MONTH")
                          views.setOnClickPendingIntent(R.id.btn_prev, PendingIntent.getBroadcast(context, 0, prevIntent, PendingIntent.FLAG_UPDATE_CURRENT or PendingIntent.FLAG_IMMUTABLE))
                          val nextIntent = Intent(context, RosterWidgetProvider::class.java).setAction("NEXT_MONTH")
                          views.setOnClickPendingIntent(R.id.btn_next, PendingIntent.getBroadcast(context, 1, nextIntent, PendingIntent.FLAG_UPDATE_CURRENT or PendingIntent.FLAG_IMMUTABLE))
                          val refreshIntent = Intent(context, RosterWidgetProvider::class.java).setAction("REFRESH_WIDGET")
                          views.setOnClickPendingIntent(R.id.btn_refresh, PendingIntent.getBroadcast(context, 2, refreshIntent, PendingIntent.FLAG_UPDATE_CURRENT or PendingIntent.FLAG_IMMUTABLE))

                          writeDebugLog(context, "✅ Widget 渲染成功 id=$appWidgetId")
                      } catch (e: Exception) {
                          writeDebugLog(context, "❌ updateAppWidget error: ${e.message}")
                      }
                      appWidgetManager.updateAppWidget(appWidgetId, views)
                  }
              }
          }
          WIDGET_EOF

          ls -la android/app/src/main/kotlin/com/example/roster_pro/
          ls -la android/app/src/main/res/layout/
          ls -la android/app/src/main/res/xml/
          ls -la android/app/src/main/res/drawable/

      - name: Build APK Release
        script: |
          BUILD_NUM=$(date +%s | tail -c 8)
          BUILD_NAME="7.5.$(date +%m%d)"
          echo "Build name: $BUILD_NAME  Build number: $BUILD_NUM"
          flutter pub get
          flutter build apk --release --no-tree-shake-icons --build-name=$BUILD_NAME --build-number=$BUILD_NUM
          ls -lh build/app/outputs/flutter-apk/

    artifacts:
      - build/app/outputs/flutter-apk/app-release.apk
      - build/app/outputs/flutter-apk/app-release.apk.sha1
      - flutter_*.log

