workflows:
  Default Workflow:
    name: RosterPro v10 FIXED 1.9.22
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: 3.22.2
      java: 17
    scripts:
      - name: Fix + Kotlin 1.9.22
        script: |
          set -e
          rm -rf test ~/.gradle/caches
          flutter config --no-analytics
          flutter create . --platforms=android --project-name roster_pro --org com.example --no-pub
          python3 << 'PY'
          import pathlib
          for fp in [pathlib.Path("android/build.gradle"), pathlib.Path("android/settings.gradle")]:
            if not fp.exists(): continue
            t=fp.read_text()
            # 一定要長的先換，否則 1.7.10 -> 1.9.220
            t=t.replace("1.7.10","1.9.22")
            t=t.replace("1.7.1","1.9.22")
            t=t.replace("1.8.22","1.9.22")
            t=t.replace("1.9.220","1.9.22") # 修復上次壞掉的
            fp.write_text(t)
            print(f"patched {fp}")
          PY
          flutter pub get
      - name: Build APK
        script: flutter build apk --release --no-tree-shake-icons
    artifacts:
      - build/**/outputs/**/*.apk
