workflows:
  Default Workflow:
    name: RosterPro v9.4 FINAL
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: 3.22.2
      java: 17
    scripts:
      - name: 0. Disable analytics
        script: flutter config --no-analytics || true

      - name: 1. Recreate Android - FIXED dot
        script: |
          set -e
          rm -rf test
          git rm -rf --cached android --ignore-unmatch || true
          rm -rf android || true
          rm -rf ~/.gradle/caches || true
          rm -f pubspec.lock || true
          # 正確寫法：點前面要有空格
          flutter create. --platforms=android --project-name roster_pro --org com.example --no-pub
          flutter pub get

      - name: 2. Overwrite lib/main.dart
        script: |
          cat > lib/main.dart << 'DART'
          import 'dart:convert';
          import 'package:flutter/material.dart';
          import 'package:intl/intl.dart';
          import 'package:shared_preferences/shared_preferences.dart';
          import 'package:device_calendar/device_calendar.dart';
          import 'package:timezone/timezone.dart' as tz;
          import 'package:timezone/data/latest.dart' as tz_data;
          import 'package:permission_handler/permission_handler.dart';
          import 'package:home_widget/home_widget.dart';
          void main(){tz_data.initializeTimeZones();runApp(const RosterApp());}
          class ShiftDef{String code;String label;double hours;Color color;String start;String end;bool hasAllowance;double allowance;bool isAllDay;ShiftDef(this.code,this.label,this.hours,this.color,{this.start='07:00',this.end='15:30',this.hasAllowance=false,this.allowance=0,this.isAllDay=false});Map<String,dynamic> toJson()=>{'code':code,'label':label,'hours':hours,'color':color.value,'start':start,'end':end,'hasAllowance':hasAllowance,'allowance':allowance,'isAllDay':isAllDay};factory ShiftDef.fromJson(Map<String,dynamic> j)=>ShiftDef(j['code'],j['label']??j['code'],(j['hours']??8).toDouble(),Color(j['color']??0xFFFF9800),start:j['start']??'07:00',end:j['end']??'15:30',hasAllowance:j['hasAllowance']??false,allowance:(j['allowance']??0).toDouble(),isAllDay:j['isAllDay']??false);}
          class RosterApp extends StatelessWidget{const RosterApp({super.key});@override Widget build(BuildContext context){return MaterialApp(title:'Roster Pro',theme:ThemeData(useMaterial3:true,colorSchemeSeed:Colors.deepPurple),home:const MainPage());}}
          class MainPage extends StatefulWidget{const MainPage({super.key});@override State<MainPage> createState()=>MainPageState();}
          class MainPageState extends State<MainPage>{int tab=0;DateTime focused=DateTime.now();DateTime selectedDay=DateTime.now();Map<String,String> roster={};Map<String,String> rosterNote={};Map<String,double> rosterOt={};Map<String,double> rosterExtra={};Map<String,double> rosterExtraHrs={};Map<String,String> rosterExtraType={};List<String> allowanceTypes=['夜更','辛勞','特別','額外'];Map<String,ShiftDef> defs={'早':ShiftDef('早','早更',8,Colors.orange,start:'07:00',end:'15:30',hasAllowance:true,allowance:80),'中':ShiftDef('中','中更',8,Colors.blue,start:'14:00',end:'22:00'),'宵':ShiftDef('宵','宵更',8,Colors.purple,start:'22:00',end:'06:00',hasAllowance:true,allowance:60),'O':ShiftDef('O','休',0,Colors.green,isAllDay:true),};List<List<String>> pattern=[["早","早","中","中","宵","宵","O"]];double carry=0;String customName='我的排更-專屬日曆';bool googleSyncEnabled=false;bool autoSync=false;final DeviceCalendarPlugin _calendarPlugin=DeviceCalendarPlugin();String? _rosterCalendarId;Map<String,String> _googleEventIdMap={};bool _isSyncing=false;
          @override void initState(){super.initState();load();}
          Future<void> load() async{var sp=await SharedPreferences.getInstance();var r=sp.getString('roster');if(r!=null)roster=Map<String,String>.from(jsonDecode(r));setState((){});}
          Future<void> save() async{var sp=await SharedPreferences.getInstance();sp.setString('roster',jsonEncode(roster));}
          int isoWeek(DateTime date){DateTime th=date.add(Duration(days:4-date.weekday));DateTime jan=DateTime(th.year,1,1);return 1+(th.difference(jan).inDays/7).floor();}
          void quickJumpMonth(){int y=focused.year;int m=focused.month;showDialog(context:context,builder:(ctx){return StatefulBuilder(builder:(ctx2,setD){return AlertDialog(title:const Text('快速查找年月'),content:Column(mainAxisSize:MainAxisSize.min,children:[Row(children:[IconButton(icon:const Icon(Icons.remove),onPressed:()=>setD(()=>y--)),Expanded(child:Text('$y年',textAlign:TextAlign.center)),IconButton(icon:const Icon(Icons.add),onPressed:()=>setD(()=>y++))]),Wrap(spacing:8,children:List.generate(12,(i){int mon=i+1;return ChoiceChip(label:Text('${mon}月'),selected:mon==m,onSelected:(_)=>setD(()=>m=mon));}))]),actions:[TextButton(onPressed:()=>Navigator.pop(ctx2),child:const Text('取消')),FilledButton(onPressed:(){setState(()=>focused=DateTime(y,m,1));Navigator.pop(ctx2);},child:const Text('跳轉'))]);});});}
          Future<bool> handleCalendarPermission() async{try{await Permission.calendarFullAccess.request();}catch(_){}try{await Permission.calendar.request();}catch(_){}var devHas=await _calendarPlugin.hasPermissions();if(devHas.isSuccess&&devHas.data==true)return true;var devReq=await _calendarPlugin.requestPermissions();return devReq.isSuccess&&devReq.data==true;}
          Future<String?> _pickGoogleCalendarDialog() async{await handleCalendarPermission();var calsResult=await _calendarPlugin.retrieveCalendars();var cals=calsResult.data??[];List<Calendar> writable=cals.where((c)=>c.isReadOnly==false).toList().cast<Calendar>();Calendar? picked=await showDialog<Calendar>(context:context,builder:(ctx){return AlertDialog(title:Text('選擇日曆 (可寫${writable.length})'),content:SizedBox(width:400,height:400,child:ListView.builder(itemCount:writable.length,itemBuilder:(c,i){var cal=writable[i];return ListTile(title:Text(cal.name??'未命名'),subtitle:Text('${cal.accountName}'),onTap:()=>Navigator.pop(ctx,cal));})),actions:[TextButton(onPressed:()=>Navigator.pop(ctx),child:const Text('取消'))],);});return picked?.id;}
          Future<void> _requestGooglePerm() async{String? id=await _pickGoogleCalendarDialog();if(id==null)return;_rosterCalendarId=id;var sp=await SharedPreferences.getInstance();sp.setString('rosterCalId',id);setState(()=>googleSyncEnabled=true);await _syncToGoogle();}
          Future<void> _ensureCalendar() async{if(_rosterCalendarId!=null){var cals=await _calendarPlugin.retrieveCalendars();if(cals.data!=null&&cals.data!.any((c)=>c.id==_rosterCalendarId))return;}String? id=await _pickGoogleCalendarDialog();if(id!=null)_rosterCalendarId=id;}
          Future<void> _syncToGoogle({bool silent=false}) async{if(!googleSyncEnabled&&!silent)return;if(_isSyncing)return;_isSyncing=true;try{if(_rosterCalendarId==null)await _ensureCalendar();if(_rosterCalendarId==null)throw '未選日曆';var existingEvents=await _calendarPlugin.retrieveEvents(_rosterCalendarId!,RetrieveEventsParams(startDate:DateTime(2023,1,1),endDate:DateTime(2030,12,31)));int del=0;for(var e in existingEvents.data??[]){if((e.description??'').contains('[RosterPro]')){await _calendarPlugin.deleteEvent(_rosterCalendarId!,e.eventId);del++;}}_googleEventIdMap.clear();for(var entry in roster.entries){var code=entry.value;var def=defs[code];if(def==null)continue;DateTime date=DateFormat('yyyy-MM-dd').parse(entry.key);DateTime startDt=DateTime(date.year,date.month,date.day,int.parse(def.start.split(':')[0]),int.parse(def.start.split(':')[1]));DateTime endDt=DateTime(date.year,date.month,date.day,int.parse(def.end.split(':')[0]),int.parse(def.end.split(':')[1]));if(endDt.isBefore(startDt))endDt=endDt.add(const Duration(days:1));String tag='[RosterPro]${entry.key}';String title=def.isAllDay?'$code 全天':'$code ${def.start}-${def.end}';var ev=Event(_rosterCalendarId!,title:title,description:'$tag $code',start:tz.TZDateTime.from(startDt,tz.local),end:tz.TZDateTime.from(endDt,tz.local),allDay:def.isAllDay);var res=await _calendarPlugin.createOrUpdateEvent(ev);if(res!=null&&res.isSuccess&&res.data!=null){_googleEventIdMap[entry.key]=res.data!;}}if(!silent&&mounted){ScaffoldMessenger.of(context).showSnackBar(SnackBar(content:Text('已同步 ${roster.length}項')));}}catch(e){if(!silent&&mounted)ScaffoldMessenger.of(context).showSnackBar(SnackBar(content:Text('同步失敗 $e')));}finally{_isSyncing=false;}}
          Widget calTab(){DateTime first=DateTime(focused.year,focused.month,1);DateTime start=first.subtract(Duration(days:first.weekday-1));int dim=DateTime(focused.year,focused.month+1,0).day;int needed=first.weekday-1+dim;int weeks=(needed/7).ceil();if(weeks<5)weeks=5;List<DateTime> days=List.generate(weeks*7,(i)=>start.add(Duration(days:i)));String selKey=DateFormat('yyyy-MM-dd').format(selectedDay);DateTime today=DateTime.now();return SafeArea(child:Column(children:[Padding(padding:const EdgeInsets.fromLTRB(12,8,12,4),child:Row(children:[InkWell(onTap:()=>quickJumpMonth(),child:Row(children:[Text('${focused.year}年${focused.month}月',style:const TextStyle(fontSize:20,fontWeight:FontWeight.bold)),const Icon(Icons.arrow_drop_down)])),const Spacer(),IconButton(icon:const Icon(Icons.chevron_left),onPressed:(){setState(()=>focused=DateTime(focused.year,focused.month-1,1));}),IconButton(icon:const Icon(Icons.chevron_right),onPressed:(){setState(()=>focused=DateTime(focused.year,focused.month+1,1));}),FilledButton.tonal(onPressed:(){setState((){focused=DateTime(today.year,today.month,1);selectedDay=DateTime(today.year,today.month,today.day);});},child:const Text('今天')),])),Expanded(child:ListView.builder(padding:EdgeInsets.zero,itemCount:weeks,itemBuilder:(ctx,row){return Row(children:[Container(width:32,alignment:Alignment.center,child:Text('W${isoWeek(days[row*7])}',style:const TextStyle(fontSize:11))),Expanded(child:GridView.builder(shrinkWrap:true,physics:const NeverScrollableScrollPhysics(),padding:const EdgeInsets.all(3),gridDelegate:const SliverGridDelegateWithFixedCrossAxisCount(crossAxisCount:7,childAspectRatio:0.78,mainAxisSpacing:4,crossAxisSpacing:4),itemCount:7,itemBuilder:(ctx2,col){int idx=row*7+col;DateTime day=days[idx];bool inM=day.month==focused.month;String k=DateFormat('yyyy-MM-dd').format(day);String? code=roster[k];var def=code!=null?defs[code]:null;bool sel=k==selKey;bool isToday=day.year==today.year&&day.month==today.month&&day.day==today.day;return GestureDetector(onTap:(){setState(()=>selectedDay=day);},child:Container(decoration:BoxDecoration(color:isToday?const Color(0xFFFFF9C4):!inM?const Color(0xFFF5F5F0):def!=null?def.color.withOpacity(0.18):const Color(0xFFFFF0D0),borderRadius:BorderRadius.circular(12),border:isToday?Border.all(width:2.5,color:Colors.orange):sel?Border.all(width:2,color:Colors.deepPurple):null),child:Column(mainAxisAlignment:MainAxisAlignment.center,children:[Text('${day.day}'),if(code!=null)Container(padding:const EdgeInsets.symmetric(horizontal:4,vertical:1),decoration:BoxDecoration(color:def?.color??Colors.orange,borderRadius:BorderRadius.circular(8)),child:Text(code,style:const TextStyle(color:Colors.white,fontSize:10))),])));})),]);})),]));}
          void showDetail(DateTime day){}
          Widget patternTab(){return const Center(child:Text('模式'));}
          Widget reportTab(){return const Center(child:Text('報表'));}
          Widget settingsTab(){return ListView(padding:const EdgeInsets.all(16),children:[SwitchListTile(title:const Text('啟用日曆同步'),value:googleSyncEnabled,onChanged:(v) async {if(v){await _requestGooglePerm();} else {setState(()=>googleSyncEnabled=false);}}),ListTile(title:const Text('手動同步'),onTap:()=>_syncToGoogle()),]);}
          @override Widget build(BuildContext context){return Scaffold(body:[calTab(),patternTab(),reportTab(),settingsTab()][tab],bottomNavigationBar:NavigationBar(selectedIndex:tab,onDestinationSelected:(i)=>setState(()=>tab=i),destinations:const[NavigationDestination(icon:Icon(Icons.calendar_month),label:'月曆'),NavigationDestination(icon:Icon(Icons.pattern),label:'模式'),NavigationDestination(icon:Icon(Icons.bar_chart),label:'報表'),NavigationDestination(icon:Icon(Icons.settings),label:'設定'),]),);}
          }
          DART

      - name: 3. Patch + Widget
        script: |
          set -e
          mkdir -p android/app/src/main/res/layout android/app/src/main/res/xml android/app/src/main/kotlin/com/example/roster_pro
          echo '<?xml version="1.0" encoding="utf-8"?><LinearLayout xmlns:android="http://schemas.android.com/apk/res/android" android:orientation="vertical" android:layout_width="match_parent" android:layout_height="match_parent" android:background="#FFFFFF" android:padding="8dp"><TextView android:id="@+id/widget_month" android:layout_width="match_parent" android:layout_height="wrap_content" android:text="Roster Pro" android:gravity="center" android:textStyle="bold"/></LinearLayout>' > android/app/src/main/res/layout/roster_widget_layout.xml
          echo '<?xml version="1.0" encoding="utf-8"?><appwidget-provider xmlns:android="http://schemas.android.com/apk/res/android" android:minWidth="180dp" android:minHeight="180dp" android:updatePeriodMillis="3600000" android:initialLayout="@layout/roster_widget_layout" android:resizeMode="horizontal|vertical" android:widgetCategory="home_screen"/>' > android/app/src/main/res/xml/roster_widget_info.xml
          cat > android/app/src/main/kotlin/com/example/roster_pro/RosterWidgetProvider.kt << 'EOF'
          package com.example.roster_pro
          import android.app.PendingIntent; import android.appwidget.AppWidgetManager; import android.appwidget.AppWidgetProvider; import android.content.Context; import android.content.Intent; import android.widget.RemoteViews
          class RosterWidgetProvider : AppWidgetProvider() { override fun onUpdate(context: Context, appWidgetManager: AppWidgetManager, appWidgetIds: IntArray) { for (id in appWidgetIds) { val views = RemoteViews(context.packageName, R.layout.roster_widget_layout); val intent = Intent(context, MainActivity::class.java); val pi = PendingIntent.getActivity(context, 0, intent, PendingIntent.FLAG_UPDATE_CURRENT or PendingIntent.FLAG_IMMUTABLE); views.setOnClickPendingIntent(R.id.widget_month, pi); appWidgetManager.updateAppWidget(id, views) } } }
          EOF
          cat > android/app/src/main/kotlin/com/example/roster_pro/MainActivity.kt << 'EOF'
          package com.example.roster_pro
          import io.flutter.embedding.android.FlutterActivity
          class MainActivity: FlutterActivity()
          EOF
          python3 << 'PY'
          import re, pathlib
          p=pathlib.Path("android/app/src/main/AndroidManifest.xml").read_text()
          p=re.sub(r'\s*<uses-permission[^>]*READ_CALENDAR[^>]*/?>\s*',"",p)
          p=re.sub(r'\s*<uses-permission[^>]*WRITE_CALENDAR[^>]*/?>\s*',"",p)
          p=re.sub(r'\s*<receiver[^>]*RosterWidgetProvider.*?</receiver>\s*',"",p,flags=re.DOTALL)
          perms=' <uses-permission android:name="android.permission.READ_CALENDAR" />\n <uses-permission android:name="android.permission.WRITE_CALENDAR" />\n'
          p=p.replace("<application", perms+"<application",1)
          receiver=' <receiver android:name=".RosterWidgetProvider" android:exported="true">\n <intent-filter><action android:name="android.appwidget.action.APPWIDGET_UPDATE" /></intent-filter>\n <meta-data android:name="android.appwidget.provider" android:resource="@xml/roster_widget_info" />\n </receiver>\n'
          p=p.replace("</application>", receiver+"</application>",1)
          pathlib.Path("android/app/src/main/AndroidManifest.xml").write_text(p)
          PY
          flutter clean; flutter pub get
          for BASE in ~/.pub-cache ~/Library/Caches; do DC=$(find $BASE -path "*device_calendar-*/android/build.gradle" 2>/dev/null | head -n 1); if [ -n "$DC" ]; then sed -i '' "s/1\.3\.41/1.9.22/g" "$DC" 2>/dev/null || sed -i "s/1\.3\.41/1.9.22/g" "$DC" || true; fi; done

      - name: 4. Build APK
        script: |
          flutter analyze || true
          flutter build apk --release --no-tree-shake-icons

    artifacts:
      - build/**/outputs/**/*.apk
