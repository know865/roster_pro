workflows:
  Default Workflow:
    name: Default Workflow
    environment:
      flutter: 3.22.2
      java: 17
    scripts:
      - name: Safe fix
        script: |
          if [ ! -d "android" ]; then
            flutter create . --platforms=android --project-name roster_pro --org com.example.rosterpro
          fi
          flutter pub get
      - name: Build APK
        script: flutter build apk --release --no-tree-shake-icons
    artifacts:
      - build/**/outputs/**/*.apk
