workflows:
  Default Workflow:
    name: Default Workflow
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      flutter: 3.22.2
      java: 17
    scripts:
      - name: Fix old Android project
        script: |
          rm -rf android
          flutter create -t app . --platforms=android --project-name roster_pro --org com.example
          # 保持原本包名，唔使重新簽名
          flutter packages pub get
      - name: Build APK
        script: |
          flutter build apk --release --no-tree-shake-icons
    artifacts:
      - build/app/outputs/flutter-apk/*.apk
