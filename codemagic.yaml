workflows:
  Default Workflow:
    name: RosterPro FINAL WORKING
    instance_type: mac_mini_m2
    environment:
      flutter: 3.22.2
      java: 17
    scripts:
      - name: Fix project
        script: |
          rm -rf test
          flutter config --no-analytics
          flutter create . --platforms=android --project-name roster_pro --org com.example --no-pub
          flutter pub get
          flutter analyze || true
      - name: Build APK
        script: |
          flutter build apk --release --no-tree-shake-icons
    artifacts:
      - build/**/outputs/**/*.apk
