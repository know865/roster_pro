workflows:
  Default Workflow:
    name: RosterPro v10 FINAL
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: 3.22.2
      java: 17
    scripts:
      - name: Fix Kotlin
        script: |
          set -e
          rm -rf test ~/.gradle/caches
          flutter config --no-analytics
          flutter create . --platforms=android --project-name roster_pro --org com.example --no-pub
          python3 << 'PY'
          import pathlib
          for fp in [pathlib.Path("android/build.gradle"), pathlib.Path("android/settings.gradle")]:
            if not fp.exists(): continue
            t=fp.read_text()
            t=t.replace("1.7.10","1.9.22").replace("1.7.1","1.9.22").replace("1.8.22","1.9.22").replace("1.9.220","1.9.22")
            fp.write_text(t)
          PY
          flutter pub get
      - name: Build APK
        script: flutter build apk --release --no-tree-shake-icons
    artifacts:
      - build/**/outputs/**/*.apk
