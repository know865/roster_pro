workflows:
  Default Workflow:
    name: Default Workflow
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: 3.22.2
      java: 17
    scripts:
      - name: 1. Force delete old android + recreate
        script: |
          set -e
          echo "=== 刪舊 android 重新建立 ==="
          git rm -rf --cached android --ignore-unmatch || true
          rm -rf android || true
          rm -f pubspec.lock || true
          flutter create --platforms=android --project-name roster_pro --org com.example . --no-pub

      - name: 2. Inject Permission + Real Calendar v7.0
        script: |
          set -e
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          echo "=== 注入權限 ==="
          sed -i.bak '/READ_CALENDAR/d' "$MANIFEST" || true
          sed -i.bak '/WRITE_CALENDAR/d' "$MANIFEST" || true
          sed -i.bak '/READ_MEDIA_IMAGES/d' "$MANIFEST" || true
          awk '
            /<application/ {
              print "    <uses-permission android:name=\"android.permission.READ_CALENDAR\" />"
              print "    <uses-permission android:name=\"android.permission.WRITE_CALENDAR\" />"
              print "    <uses-permission android:name=\"android.permission.READ_MEDIA_IMAGES\" />"
              print "    <uses-permission android:name=\"android.permission.READ_EXTERNAL_STORAGE\" android:maxSdkVersion=\"32\" />"
              print "    <uses-permission android:name=\"android.permission.WRITE_EXTERNAL_STORAGE\" android:maxSdkVersion=\"32\" />"
              print ""
            }
            {print}
          ' "$MANIFEST" > "$MANIFEST.tmp" && mv "$MANIFEST.tmp" "$MANIFEST"
          mkdir -p android/app/src/main/kotlin/com/example/roster_pro
          cat > android/app/src/main/kotlin/com/example/roster_pro/MainActivity.kt << 'EOF'
          package com.example.roster_pro
          import android.content.ContentResolver
          import android.database.Cursor
          import android.provider.CalendarContract
          import io.flutter.embedding.android.FlutterActivity
          import io.flutter.embedding.engine.FlutterEngine
          import io.flutter.plugin.common.MethodChannel
          class MainActivity: FlutterActivity() {
              private val CHANNEL = "com.roster/calendar_real"
              override fun configureFlutterEngine(flutterEngine: FlutterEngine) {
                  super.configureFlutterEngine(flutterEngine)
                  MethodChannel(flutterEngine.dartExecutor.binaryMessenger, CHANNEL).setMethodCallHandler { call, result ->
                      if (call.method == "getCalendars") {
                          try {
                              val cr: ContentResolver = contentResolver
                              val uri = CalendarContract.Calendars.CONTENT_URI
                              val projection = arrayOf(CalendarContract.Calendars._ID, CalendarContract.Calendars.CALENDAR_DISPLAY_NAME, CalendarContract.Calendars.ACCOUNT_NAME, CalendarContract.Calendars.ACCOUNT_TYPE, CalendarContract.Calendars.OWNER_ACCOUNT, CalendarContract.Calendars.CALENDAR_ACCESS_LEVEL)
                              val cur: Cursor? = cr.query(uri, projection, null, null, null)
                              val list = mutableListOf<Map<String, Any?>>()
                              if (cur != null) {
                                  while (cur.moveToNext()) {
                                      val id = cur.getLong(0); val displayName = cur.getString(1) ?: ""; val accName = cur.getString(2) ?: ""; val accType = cur.getString(3) ?: ""; val owner = cur.getString(4) ?: ""; val access = cur.getInt(5)
                                      list.add(mapOf("id" to id.toString(), "displayName" to displayName, "accountName" to accName, "accountType" to accType, "owner" to owner, "access" to access, "isGoogle" to (accType == "com.google" || accName.contains("@gmail.com"))))
                                  }
                                  cur.close()
                              }
                              result.success(list)
                          } catch (e: Exception) { result.error("ERR", e.message, null) }
                      } else { result.notImplemented() }
                  }
              }
          }
          EOF
          flutter clean
          flutter pub get

      - name: 3. Build APK v7.0
        script: flutter build apk --release --no-tree-shake-icons

    artifacts:
      - build/**/outputs/**/*.apk
