workflows:
  roster-pro-v2:
    name: Roster Pro V2
    instance_type: mac_mini_m2
    environment:
      flutter: 3.22.2
    scripts:
      - name: Fix empty repo
        script: |
          if [ ! -d "android" ]; then
            flutter create . --platforms=android --project-name roster_pro
          fi
      - name: Get packages
        script: flutter pub get
      - name: Build APK
        script: flutter build apk --release --verbose
    artifacts:
      - build/**/outputs/**/*.apk
      - build/**/*.apk
      - "**/*.apk"
