workflows:
  Default Workflow:
    name: RosterPro v8.0 Build
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: 3.22.2
      java: 17
    scripts:
      - name: 1. Recreate Android
        script: |
          git rm -rf --cached android --ignore-unmatch || true
          rm -rf android || true
          rm -f pubspec.lock || true
          flutter create --platforms=android --project-name roster_pro --org com.example . --no-pub
      - name: 2. Fix Kotlin & Add Widget
        script: |
          sed -i.bak "s/ext.kotlin_version = '.*'/ext.kotlin_version = '1.8.10'/" android/build.gradle
          APP_GRADLE="android/app/build.gradle"
          awk '/android {/ {print; print "    configurations.all { resolutionStrategy { force \x27org.jetbrains.kotlin:kotlin-stdlib:1.8.10\x27; force \x27org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.10\x27; force \x27org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.10\x27 } }"; next} {print}' "$APP_GRADLE" > tmp && mv tmp "$APP_GRADLE"
          
          # 建立 4x4 Widget
          mkdir -p android/app/src/main/res/layout android/app/src/main/res/xml
          cat > android/app/src/main/res/layout/roster_widget_layout.xml << 'EOF'
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android" android:orientation="vertical" android:background="#FFFFFF" android:padding="8dp" android:layout_width="match_parent" android:layout_height="match_parent">
            <TextView android:id="@+id/widget_month" android:layout_width="match_parent" android:layout_height="wrap_content" android:textSize="14sp" android:textStyle="bold" android:gravity="center"/>
            <GridView android:id="@+id/widget_grid" android:numColumns="8" android:layout_width="match_parent" android:layout_height="match_parent"/>
          </LinearLayout>
          EOF
          cat > android/app/src/main/res/xml/roster_widget_info.xml << 'EOF'
          <appwidget-provider xmlns:android="http://schemas.android.com/apk/res/android" android:minWidth="240dp" android:minHeight="240dp" android:updatePeriodMillis="3600000" android:initialLayout="@layout/roster_widget_layout" android:resizeMode="horizontal|vertical" android:widgetCategory="home_screen" android:widgetFeatures="reconfigurable"/>
          EOF
          # MainActivity 已有真ID讀取，保留
          cat > android/app/src/main/kotlin/com/example/roster_pro/RosterWidgetProvider.kt << 'EOF'
          package com.example.roster_pro
          import android.app.PendingIntent
          import android.appwidget.AppWidgetManager
          import android.appwidget.AppWidgetProvider
          import android.content.Context
          import android.content.Intent
          import android.widget.RemoteViews
          class RosterWidgetProvider : AppWidgetProvider() {
            override fun onUpdate(c: Context, m: AppWidgetManager, ids: IntArray){
              for(id in ids){
                val views = RemoteViews(c.packageName, R.layout.roster_widget_layout)
                val intent = Intent(c, MainActivity::class.java)
                val pi = PendingIntent.getActivity(c, 0, intent, PendingIntent.FLAG_IMMUTABLE)
                views.setOnClickPendingIntent(R.id.widget_grid, pi)
                m.updateAppWidget(id, views)
              }
            }
          }
          EOF
          # 注入 Widget到 Manifest
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          sed -i.bak '/RosterWidgetProvider/d' "$MANIFEST"
          awk '/<activity/{print; print "        <receiver android:name=\".RosterWidgetProvider\" android:exported=\"true\"><intent-filter><action android:name=\"android.appwidget.action.APPWIDGET_UPDATE\" /></intent-filter><meta-data android:name=\"android.appwidget.provider\" android:resource=\"@xml/roster_widget_info\" /></receiver>"; next}1' "$MANIFEST" > tmp && mv tmp "$MANIFEST"
          flutter clean; flutter pub get
      - name: 3. Build APK
        script: flutter build apk --release --no-tree-shake-icons
    artifacts:
      - build/**/outputs/**/*.apk
