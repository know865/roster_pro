workflows:
  Default Workflow:
    name: RosterPro v8.4 Fix device_calendar
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: 3.22.2
      java: 17
    scripts:
      - name: 1. Recreate Android + Fix pubspec
        script: |
          set -e
          git rm -rf --cached android --ignore-unmatch || true
          rm -rf android || true
          rm -rf ~/.gradle/caches || true
          rm -f pubspec.lock || true
          flutter create --platforms=android --project-name roster_pro --org com.example . --no-pub
          flutter pub get

      - name: 2. Patch device_calendar Kotlin 1.3.41 -> 1.9.22
        script: |
          set -e
          # 搵到 pub cache 入面 device_calendar 的 android/build.gradle
          DC_PATH=$(find ~/.pub-cache -path "*device_calendar-*/android/build.gradle" | head -n 1)
          echo "Found device_calendar at: $DC_PATH"
          cat "$DC_PATH"
          # 強制改寫
          sed -i '' "s/ext.kotlin_version = '[^']*'/ext.kotlin_version = '1.9.22'/" "$DC_PATH" || sed -i "s/ext.kotlin_version = '[^']*'/ext.kotlin_version = '1.9.22'/" "$DC_PATH"
          sed -i '' "s/\"org.jetbrains.kotlin:kotlin-gradle-plugin:[^\"]*\"/\"org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.22\"/" "$DC_PATH" || sed -i "s/\"org.jetbrains.kotlin:kotlin-gradle-plugin:[^\"]*\"/\"org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.22\"/" "$DC_PATH"
          sed -i '' "s/org.jetbrains.kotlin:kotlin-gradle-plugin:1.3.41/org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.22/g" "$DC_PATH" || sed -i "s/org.jetbrains.kotlin:kotlin-gradle-plugin:1.3.41/org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.22/g" "$DC_PATH"
          echo "=== PATCHED ==="
          cat "$DC_PATH"

          # 同時改 settings.gradle
          python3 << 'PY'
          import re, pathlib
          for p in ["android/settings.gradle","android/settings.gradle.kts"]:
              fp=pathlib.Path(p)
              if not fp.exists(): continue
              t=fp.read_text()
              t=re.sub(r'id\s*\(\s*"org.jetbrains.kotlin.android"\s*\)\s*version\s*"[^"]+"', 'id("org.jetbrains.kotlin.android") version "1.9.22"', t)
              t=re.sub(r'id\s+"org.jetbrains.kotlin.android"\s+version\s+"[^"]+"', 'id "org.jetbrains.kotlin.android" version "1.9.22" apply false', t)
              fp.write_text(t)
          PY

      - name: 3. Force Kotlin 1.9.22 Everywhere else
        script: |
          set -e
          python3 << 'PY'
          import re, pathlib
          bg=pathlib.Path("android/build.gradle")
          if bg.exists():
              t=bg.read_text()
              t=re.sub(r"ext.kotlin_version\s*=\s*'[^']+'", "ext.kotlin_version = '1.9.22'", t)
              if "ext.kotlin_version" not in t:
                  t=t.replace("buildscript {", "buildscript {\n    ext.kotlin_version = '1.9.22'\n")
              bg.write_text(t)
          app=pathlib.Path("android/app/build.gradle")
          t=app.read_text()
          if "resolutionStrategy" not in t:
              t=t.replace("android {", "android {\n    configurations.all {\n        resolutionStrategy {\n            force 'org.jetbrains.kotlin:kotlin-stdlib:1.9.22'\n            force 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.9.22'\n            force 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.9.22'\n        }\n    }")
          app.write_text(t)
          PY

      - name: 4. Inject Widget + Manifest
        script: |
          set -e
          mkdir -p android/app/src/main/res/layout android/app/src/main/res/xml android/app/src/main/kotlin/com/example/roster_pro
          cat > android/app/src/main/res/layout/roster_widget_layout.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android" android:orientation="vertical" android:layout_width="match_parent" android:layout_height="match_parent" android:background="#FFFFFF" android:padding="8dp">
            <TextView android:id="@+id/widget_month" android:layout_width="match_parent" android:layout_height="wrap_content" android:text="Roster Pro" android:gravity="center" android:textStyle="bold"/>
          </LinearLayout>
          EOF
          cat > android/app/src/main/res/xml/roster_widget_info.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <appwidget-provider xmlns:android="http://schemas.android.com/apk/res/android" android:minWidth="180dp" android:minHeight="180dp" android:updatePeriodMillis="3600000" android:initialLayout="@layout/roster_widget_layout" android:resizeMode="horizontal|vertical" android:widgetCategory="home_screen"/>
          EOF
          cat > android/app/src/main/kotlin/com/example/roster_pro/RosterWidgetProvider.kt << 'EOF'
          package com.example.roster_pro
          import android.app.PendingIntent; import android.appwidget.AppWidgetManager; import android.appwidget.AppWidgetProvider; import android.content.Context; import android.content.Intent; import android.widget.RemoteViews
          class RosterWidgetProvider : AppWidgetProvider() {
            override fun onUpdate(context: Context, appWidgetManager: AppWidgetManager, appWidgetIds: IntArray) {
              for (id in appWidgetIds) {
                val views = RemoteViews(context.packageName, R.layout.roster_widget_layout)
                val intent = Intent(context, MainActivity::class.java)
                val pi = PendingIntent.getActivity(context, 0, intent, PendingIntent.FLAG_UPDATE_CURRENT or PendingIntent.FLAG_IMMUTABLE)
                views.setOnClickPendingIntent(R.id.widget_month, pi)
                appWidgetManager.updateAppWidget(id, views)
              }
            }
          }
          EOF
          python3 << 'PY'
          import re
          path="android/app/src/main/AndroidManifest.xml"
          xml=open(path,encoding='utf-8').read()
          xml=re.sub(r'\s*<uses-permission[^>]*READ_CALENDAR[^>]*/?>\s*',"",xml)
          xml=re.sub(r'\s*<uses-permission[^>]*WRITE_CALENDAR[^>]*/?>\s*',"",xml)
          xml=re.sub(r'\s*<receiver[^>]*RosterWidgetProvider.*?</receiver>\s*',"",xml,flags=re.DOTALL)
          perms='    <uses-permission android:name="android.permission.READ_CALENDAR" />\n    <uses-permission android:name="android.permission.WRITE_CALENDAR" />\n'
          xml=xml.replace("<application", perms+"<application",1)
          receiver='        <receiver android:name=".RosterWidgetProvider" android:exported="true">\n            <intent-filter><action android:name="android.appwidget.action.APPWIDGET_UPDATE" /></intent-filter>\n            <meta-data android:name="android.appwidget.provider" android:resource="@xml/roster_widget_info" />\n        </receiver>\n'
          xml=xml.replace("</application>", receiver+"</application>",1)
          open(path,"w",encoding='utf-8').write(xml)
          PY
          flutter clean
          flutter pub get
          # 再 patch 一次，因為 clean 後 pub get 會還原
          DC_PATH=$(find ~/.pub-cache -path "*device_calendar-*/android/build.gradle" | head -n 1)
          sed -i '' "s/1.3.41/1.9.22/g" "$DC_PATH" || sed -i "s/1.3.41/1.9.22/g" "$DC_PATH"

      - name: 5. Build APK
        script: |
          flutter build apk --release --no-tree-shake-icons

    artifacts:
      - build/**/outputs/**/*.apk
