workflows:
  Default Workflow:
    name: Default Workflow
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: 3.22.2
      java: 17
    scripts:
      - name: Force delete old android on phone
        script: |
          set -e
          echo "=== 手機版自動刪舊 android ==="
          git rm -rf --cached android || true
          rm -rf android
          rm -f pubspec.lock
          flutter create --platforms=android --project-name roster_pro --org com.example .
          flutter clean
          flutter pub get
          ls android/gradle/wrapper/
      - name: Build APK
        script: flutter build apk --release --no-tree-shake-icons
    artifacts:
      - build/**/outputs/**/*.apk
