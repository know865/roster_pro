workflows:
  Default Workflow:
    name: RosterPro v8.6 AutoFix Bracket
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: 3.22.2
      java: 17
    scripts:
      - name: 0. AutoFix main.dart bracket 310/317
        script: |
          set -e
          echo "=== BEFORE ==="
          sed -n '300,330p' lib/main.dart
          python3 << 'PY'
          import pathlib, re
          p=pathlib.Path("lib/main.dart")
          t=p.read_text(encoding='utf-8')
          # 1. 最兇手： })))), -> ])),
          t=t.replace('})))),', '])),')
          # 2. 修復 Checkbox 誤寫： setS(()=>isAllDay=v  -> setS(()=>{isAllDay=
          t=t.replace('setS(()=>isAllDay=', 'setS(()=>{isAllDay=')
          t=t.replace('setS(()=>hasAllow=', 'setS(()=>{hasAllow=')
          # 3. 補上 });  (Checkbox 那兩行)
          t=re.sub(r'setS\(\(\)\{ isAllDay=v\?\?false; \},\)', 'setS(()=>{ isAllDay=v??false; });', t)
          t=re.sub(r'setS\(\(\)\{ hasAllow=v\?\?false; \},\)', 'setS(()=>{ hasAllow=v??false; });', t)
          # 4. 確保 Container 關閉是 ])), 不是 }))),
          # 如果有 連續的 ])),\n})))), 改成 ])),\n])),
          t=re.sub(r'\]\)\),\s*\n\s*\}\]\)\)\),', '] )),\n] )),', t)
          p.write_text(t, encoding='utf-8')
          print("=== AFTER ===")
          print('\n'.join(p.read_text(encoding='utf-8').splitlines()[300:330]))
          PY

      - name: 1. Recreate Android
        script: |
          set -e
          git rm -rf --cached android --ignore-unmatch || true
          rm -rf android || true
          rm -rf ~/.gradle/caches || true
          rm -f pubspec.lock || true
          flutter create --platforms=android --project-name roster_pro --org com.example . --no-pub
          flutter pub get

      - name: 2. Patch device_calendar Kotlin 1.3.41 -> 1.9.22
        script: |
          set -e
          for BASE in ~/.pub-cache ~/Library/Caches; do
            DC=$(find $BASE -path "*device_calendar-*/android/build.gradle" 2>/dev/null | head -n 1)
            if [ -n "$DC" ]; then
              echo "Patching $DC"
              sed -i '' "s/1\.3\.41/1.9.22/g" "$DC" 2>/dev/null || sed -i "s/1\.3\.41/1.9.22/g" "$DC"
              cat "$DC" | grep kotlin || true
            fi
          done

      - name: 3. Inject Widget + MainActivity
        script: |
          set -e
          mkdir -p android/app/src/main/res/layout android/app/src/main/res/xml android/app/src/main/kotlin/com/example/roster_pro
          cat > android/app/src/main/res/layout/roster_widget_layout.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?><LinearLayout xmlns:android="http://schemas.android.com/apk/res/android" android:orientation="vertical" android:layout_width="match_parent" android:layout_height="match_parent" android:background="#FFFFFF" android:padding="8dp"><TextView android:id="@+id/widget_month" android:layout_width="match_parent" android:layout_height="wrap_content" android:text="Roster Pro" android:gravity="center" android:textStyle="bold"/></LinearLayout>
          EOF
          cat > android/app/src/main/res/xml/roster_widget_info.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?><appwidget-provider xmlns:android="http://schemas.android.com/apk/res/android" android:minWidth="180dp" android:minHeight="180dp" android:updatePeriodMillis="3600000" android:initialLayout="@layout/roster_widget_layout" android:resizeMode="horizontal|vertical" android:widgetCategory="home_screen"/>
          EOF
          cat > android/app/src/main/kotlin/com/example/roster_pro/RosterWidgetProvider.kt << 'EOF'
          package com.example.roster_pro
          import android.app.PendingIntent; import android.appwidget.AppWidgetManager; import android.appwidget.AppWidgetProvider; import android.content.Context; import android.content.Intent; import android.widget.RemoteViews
          class RosterWidgetProvider : AppWidgetProvider() { override fun onUpdate(context: Context, appWidgetManager: AppWidgetManager, appWidgetIds: IntArray) { for (id in appWidgetIds) { val views = RemoteViews(context.packageName, R.layout.roster_widget_layout); val intent = Intent(context, MainActivity::class.java); val pi = PendingIntent.getActivity(context, 0, intent, PendingIntent.FLAG_UPDATE_CURRENT or PendingIntent.FLAG_IMMUTABLE); views.setOnClickPendingIntent(R.id.widget_month, pi); appWidgetManager.updateAppWidget(id, views) } } }
          EOF
          cat > android/app/src/main/kotlin/com/example/roster_pro/MainActivity.kt << 'EOF'
          package com.example.roster_pro
          import io.flutter.embedding.android.FlutterActivity
          class MainActivity: FlutterActivity()
          EOF
          python3 << 'PY'
          import re
          path="android/app/src/main/AndroidManifest.xml"
          xml=open(path,encoding='utf-8').read()
          xml=re.sub(r'\s*<uses-permission[^>]*READ_CALENDAR[^>]*/?>\s*',"",xml)
          xml=re.sub(r'\s*<uses-permission[^>]*WRITE_CALENDAR[^>]*/?>\s*',"",xml)
          xml=re.sub(r'\s*<receiver[^>]*RosterWidgetProvider.*?</receiver>\s*',"",xml,flags=re.DOTALL)
          perms='    <uses-permission android:name="android.permission.READ_CALENDAR" />\n    <uses-permission android:name="android.permission.WRITE_CALENDAR" />\n'
          xml=xml.replace("<application", perms+"<application",1)
          receiver='        <receiver android:name=".RosterWidgetProvider" android:exported="true">\n            <intent-filter><action android:name="android.appwidget.action.APPWIDGET_UPDATE" /></intent-filter>\n            <meta-data android:name="android.appwidget.provider" android:resource="@xml/roster_widget_info" />\n        </receiver>\n'
          xml=xml.replace("</application>", receiver+"</application>",1)
          open(path,"w",encoding='utf-8').write(xml)
          PY
          flutter clean
          flutter pub get
          for BASE in ~/.pub-cache ~/Library/Caches; do DC=$(find $BASE -path "*device_calendar-*/android/build.gradle" 2>/dev/null | head -n 1); if [ -n "$DC" ]; then sed -i '' "s/1\.3\.41/1.9.22/g" "$DC" 2>/dev/null || sed -i "s/1\.3\.41/1.9.22/g" "$DC"; fi; done

      - name: 4. Build APK
        script: |
          flutter analyze || true
          flutter build apk --release --no-tree-shake-icons

    artifacts:
      - build/**/outputs/**/*.apk
