workflows:
  android-roster-pro-v71-9fix:
    name: Roster Pro v7.1 9Fix - Android APK
    max_build_duration: 60
    instance_type: mac_mini_m1
    environment:
      flutter: 3.24.5
      java: 17
      groups:
        - keystore_credentials  # 如果無keystore可刪除此行，用debug簽名
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
    scripts:
      - name: Set up Flutter
        script: |
          flutter --version
          flutter clean
          flutter pub get

      - name: Fix Android v1 Embedding + Widget 4x4
        script: |
          set -e
          MANIFEST="android/app/src/main/AndroidManifest.xml"

          # ==========================================================
          # 步驟 1: 徹底清理 v1 embedding (Build failed 核心修復)
          # ==========================================================
          echo "=== Cleaning up v1 embedding references ==="
          
          # 備份
          cp "$MANIFEST" "${MANIFEST}.bak"
          
          # 1a. 移除 io.flutter.app.FlutterApplication 引用（改成 ${applicationName}）
          sed -i.bak 's|android:name="io\.flutter\.app\.FlutterApplication"|android:name="${applicationName}"|g' "$MANIFEST"
          
          # 1b. 移除舊的 SplashScreenUntilFirstFrame meta-data
          sed -i.bak '/io\.flutter\.app\.android\.SplashScreenUntilFirstFrame/d' "$MANIFEST"
          
          # 1c. 移除舊的 FlutterActivity meta-data（如果有）
          sed -i.bak '/io\.flutter\.app\.FlutterActivity/d' "$MANIFEST"
          
          # 1d. 確保 flutterEmbedding = 2 存在
          if ! grep -q 'flutterEmbedding' "$MANIFEST"; then
            sed -i.bak 's|</application>|        <meta-data android:name="flutterEmbedding" android:value="2" />\n    </application>|' "$MANIFEST"
          fi
          
          echo "=== AndroidManifest.xml after cleanup ==="
          cat "$MANIFEST"
          
          # ==========================================================
          # 步驟 2: 強制刪除所有舊 MainActivity，重新生成 v2 版本
          # ==========================================================
          echo "=== Removing old MainActivity files ==="
          find android/app/src/main -name "MainActivity.kt" -delete || true
          find android/app/src/main -name "MainActivity.java" -delete || true
          
          # 決定包名資料夾路徑 (預設 com.example.roster_pro)
          PKG_PATH="android/app/src/main/kotlin/com/example/roster_pro"
          mkdir -p "$PKG_PATH"
          
          cat > "$PKG_PATH/MainActivity.kt" <<'KT'
          package com.example.roster_pro

          import android.Manifest
          import android.content.pm.PackageManager
          import android.provider.CalendarContract
          import androidx.core.content.ContextCompat
          import io.flutter.embedding.android.FlutterActivity
          import io.flutter.embedding.engine.FlutterEngine
          import io.flutter.plugin.common.MethodChannel

          class MainActivity : FlutterActivity() {
              private val CHANNEL = "com.roster/calendar_real"
              override fun configureFlutterEngine(flutterEngine: FlutterEngine) {
                  super.configureFlutterEngine(flutterEngine)
                  MethodChannel(flutterEngine.dartExecutor.binaryMessenger, CHANNEL).setMethodCallHandler { call, result ->
                      if (call.method == "getCalendars") {
                          if (ContextCompat.checkSelfPermission(this, Manifest.permission.READ_CALENDAR) != PackageManager.PERMISSION_GRANTED) {
                              result.error("PERMISSION", "No calendar permission", null)
                              return@setMethodCallHandler
                          }
                          val calendars = mutableListOf<Map<String, Any?>>()
                          val uri = CalendarContract.Calendars.CONTENT_URI
                          val projection = arrayOf(
                              CalendarContract.Calendars._ID,
                              CalendarContract.Calendars.CALENDAR_DISPLAY_NAME,
                              CalendarContract.Calendars.ACCOUNT_NAME,
                              CalendarContract.Calendars.ACCOUNT_TYPE
                          )
                          val cursor = contentResolver.query(uri, projection, null, null, null)
                          cursor?.use {
                              while (it.moveToNext()) {
                                  val id = it.getLong(0).toString()
                                  val displayName = it.getString(1) ?: "Unnamed"
                                  val accountName = it.getString(2) ?: ""
                                  val accountType = it.getString(3) ?: ""
                                  val isGoogle = accountName.contains("gmail") || accountType.contains("google") || accountName.contains("google")
                                  calendars.add(mapOf(
                                      "id" to id,
                                      "displayName" to displayName,
                                      "accountName" to accountName,
                                      "accountType" to accountType,
                                      "isGoogle" to isGoogle
                                  ))
                              }
                          }
                          result.success(calendars)
                      } else {
                          result.notImplemented()
                      }
                  }
              }
          }
          KT
          echo "MainActivity.kt (v2) created at $PKG_PATH"

          # ==========================================================
          # 步驟 3: 建立 widget_info.xml (小工具配置，缺少會編譯失敗)
          # ==========================================================
          mkdir -p android/app/src/main/res/xml
          cat > android/app/src/main/res/xml/widget_info.xml <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <appwidget-provider xmlns:android="http://schemas.android.com/apk/res/android"
              android:minWidth="250dp"
              android:minHeight="250dp"
              android:updatePeriodMillis="1800000"
              android:initialLayout="@layout/widget_layout"
              android:resizeMode="horizontal|vertical"
              android:widgetCategory="home_screen">
          </appwidget-provider>
          XML

          # ==========================================================
          # 步驟 4: 建立 widget_layout.xml (42 個日期格子)
          # ==========================================================
          mkdir -p android/app/src/main/res/layout
          cat > android/app/src/main/res/layout/widget_layout.xml <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
