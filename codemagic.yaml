workflows:
  roster-pro-v2:
    name: Roster Pro V2
    instance_type: mac_mini_m2
    environment:
      flutter: 3.19.6
    scripts:
      - name: Create project if missing
        script: |
          if [ ! -d "android" ]; then
            flutter create . --project-name roster_pro --platforms=android
          fi
      - name: Get packages
        script: flutter pub get
      - name: Build APK
        script: flutter build apk --release
    artifacts:
      - build/app/outputs/flutter-apk/*.apk
