workflows:
  Default Workflow:
    name: RosterPro v8.1 Kotlin1.9 Fix
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: 3.22.2
      java: 17
    scripts:
      - name: 1. Recreate Android
        script: |
          set -e
          git rm -rf --cached android --ignore-unmatch || true
          rm -rf android || true
          rm -f pubspec.lock || true
          flutter create --platforms=android --project-name roster_pro --org com.example . --no-pub

      - name: 2. Upgrade Kotlin to 1.9.22 to match home_widget
        script: |
          set -e
          echo "=== 強制升級 Kotlin 1.9.22 ==="
          python3 << 'PY'
          path="android/build.gradle"
          txt=open(path).read()
          # 1. 改 ext.kotlin_version
          import re
          txt=re.sub(r"ext.kotlin_version\s*=\s*'[^']+'", "ext.kotlin_version = '1.9.22'", txt)
          # 2. 確保用 1.9.22 的 gradle plugin
          if "kotlin_version" not in txt:
              txt=txt.replace("buildscript {", "buildscript {\n    ext.kotlin_version = '1.9.22'")
          open(path,"w").write(txt)
          print(open(path).read())

          # 3. app/build.gradle 強制 stdlib 1.9.0
          app="android/app/build.gradle"
          txt=open(app).read()
          if "resolutionStrategy" not in txt:
              txt=txt.replace("android {","android {\n    configurations.all {\n        resolutionStrategy {\n            force 'org.jetbrains.kotlin:kotlin-stdlib:1.9.0'\n            force 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.9.0'\n            force 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.9.0'\n            force 'org.jetbrains.kotlin:kotlin-stdlib-common:1.9.0'\n        }\n    }")
          open(app,"w").write(txt)
          PY

      - name: 3. Inject Permissions + Widget
        script: |
          set -e
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          mkdir -p android/app/src/main/res/layout android/app/src/main/res/xml android/app/src/main/kotlin/com/example/roster_pro

          cat > android/app/src/main/res/layout/roster_widget_layout.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android" android:orientation="vertical" android:layout_width="match_parent" android:layout_height="match_parent" android:background="#FFFFFF" android:padding="8dp">
            <TextView android:id="@+id/widget_month" android:layout_width="match_parent" android:layout_height="wrap_content" android:text="Roster Pro" android:gravity="center" android:textStyle="bold" android:textSize="14sp"/>
            <TextView android:id="@+id/widget_hint" android:layout_width="match_parent" android:layout_height="wrap_content" android:text="點擊進入App" android:gravity="center" android:textSize="10sp"/>
          </LinearLayout>
          EOF

          cat > android/app/src/main/res/xml/roster_widget_info.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <appwidget-provider xmlns:android="http://schemas.android.com/apk/res/android" android:minWidth="180dp" android:minHeight="180dp" android:updatePeriodMillis="3600000" android:initialLayout="@layout/roster_widget_layout" android:resizeMode="horizontal|vertical" android:widgetCategory="home_screen"/>
          EOF

          cat > android/app/src/main/kotlin/com/example/roster_pro/RosterWidgetProvider.kt << 'EOF'
          package com.example.roster_pro
          import android.app.PendingIntent
          import android.appwidget.AppWidgetManager
          import android.appwidget.AppWidgetProvider
          import android.content.Context
          import android.content.Intent
          import android.widget.RemoteViews
          class RosterWidgetProvider : AppWidgetProvider() {
            override fun onUpdate(context: Context, appWidgetManager: AppWidgetManager, appWidgetIds: IntArray) {
              for (appWidgetId in appWidgetIds) {
                val views = RemoteViews(context.packageName, R.layout.roster_widget_layout)
                val intent = Intent(context, MainActivity::class.java)
                val pendingIntent = PendingIntent.getActivity(context, 0, intent, PendingIntent.FLAG_UPDATE_CURRENT or PendingIntent.FLAG_IMMUTABLE)
                views.setOnClickPendingIntent(R.id.widget_month, pendingIntent)
                views.setOnClickPendingIntent(R.id.widget_hint, pendingIntent)
                appWidgetManager.updateAppWidget(appWidgetId, views)
              }
            }
          }
          EOF

          python3 << 'PY'
          import re
          path="android/app/src/main/AndroidManifest.xml"
          xml=open(path,encoding='utf-8').read()
          xml=re.sub(r'\s*<uses-permission[^>]*READ_CALENDAR[^>]*/?>\s*',"",xml)
          xml=re.sub(r'\s*<uses-permission[^>]*WRITE_CALENDAR[^>]*/?>\s*',"",xml)
          xml=re.sub(r'\s*<receiver[^>]*RosterWidgetProvider.*?</receiver>\s*',"",xml,flags=re.DOTALL)
          perms='    <uses-permission android:name="android.permission.READ_CALENDAR" />\n    <uses-permission android:name="android.permission.WRITE_CALENDAR" />\n    <uses-permission android:name="android.permission.READ_MEDIA_IMAGES" />\n'
          xml=xml.replace("<application", perms+"<application",1)
          receiver='        <receiver android:name=".RosterWidgetProvider" android:exported="true">\n            <intent-filter><action android:name="android.appwidget.action.APPWIDGET_UPDATE" /></intent-filter>\n            <meta-data android:name="android.appwidget.provider" android:resource="@xml/roster_widget_info" />\n        </receiver>\n'
          xml=xml.replace("</application>", receiver+"</application>",1)
          open(path,"w",encoding='utf-8').write(xml)
          PY

          cat > android/app/src/main/kotlin/com/example/roster_pro/MainActivity.kt << 'EOF'
          package com.example.roster_pro
          import android.content.ContentResolver
          import android.database.Cursor
          import android.provider.CalendarContract
          import io.flutter.embedding.android.FlutterActivity
          import io.flutter.embedding.engine.FlutterEngine
          import io.flutter.plugin.common.MethodChannel
          class MainActivity: FlutterActivity() {
              private val CHANNEL = "com.roster/calendar_real"
              override fun configureFlutterEngine(flutterEngine: FlutterEngine) {
                  super.configureFlutterEngine(flutterEngine)
                  MethodChannel(flutterEngine.dartExecutor.binaryMessenger, CHANNEL).setMethodCallHandler { call, result ->
                      if (call.method == "getCalendars") {
                          try {
                              val cr: ContentResolver = contentResolver
                              val uri = CalendarContract.Calendars.CONTENT_URI
                              val projection = arrayOf(CalendarContract.Calendars._ID, CalendarContract.Calendars.CALENDAR_DISPLAY_NAME, CalendarContract.Calendars.ACCOUNT_NAME, CalendarContract.Calendars.ACCOUNT_TYPE, CalendarContract.Calendars.OWNER_ACCOUNT, CalendarContract.Calendars.CALENDAR_ACCESS_LEVEL)
                              val cur: Cursor? = cr.query(uri, projection, null, null, null)
                              val list = mutableListOf<Map<String, Any?>>()
                              if (cur != null) {
                                  while (cur.moveToNext()) {
                                      val id = cur.getLong(0); val displayName = cur.getString(1) ?: ""; val accName = cur.getString(2) ?: ""; val accType = cur.getString(3) ?: ""; val owner = cur.getString(4) ?: ""; val access = cur.getInt(5)
                                      list.add(mapOf("id" to id.toString(), "displayName" to displayName, "accountName" to accName, "accountType" to accType, "owner" to owner, "access" to access, "isGoogle" to (accType == "com.google" || accName.contains("@gmail.com"))))
                                  }
                                  cur.close()
                              }
                              result.success(list)
                          } catch (e: Exception) { result.error("ERR", e.message, null) }
                      } else { result.notImplemented() }
                  }
              }
          }
          EOF
          flutter clean
          flutter pub get

      - name: 4. Build APK
        script: flutter build apk --release --no-tree-shake-icons

    artifacts:
      - build/**/outputs/**/*.apk
