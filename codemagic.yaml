workflows:
  Roster Pro V2:
    name: Roster Pro V2
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      flutter: 3.22.2
      xcode: latest
      cocoapods: default
    scripts:
      - name: Get packages
        script: |
          flutter packages pub get
      - name: Build APK
        script: |
          flutter build apk --release
    artifacts:
      - build/app/outputs/flutter-apk/*.apk
