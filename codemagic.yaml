workflows:
  android-roster-pro-v71-9fix:
    name: Roster Pro v7.1 9Fix - Android APK
    max_build_duration: 60
    instance_type: mac_mini_m1
    environment:
      flutter: 3.24.5
      java: 17
      groups:
        - keystore_credentials
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
    scripts:
      - name: Set up Flutter
        script: |
          flutter --version
          flutter clean
          flutter pub get

      - name: Rebuild Android Skeleton
        script: |
          echo "=== 備份 lib/main.dart ==="
          cp lib/main.dart /tmp/main.dart.bak

          echo "=== 刪除損壞的 android 目錄 ==="
          rm -rf android

          echo "=== 使用 flutter create 重建標準 android 骨架 ==="
          # 保留 lib、pubspec.yaml，只重建 android 平台
          flutter create --platforms=android --org com.example --project-name roster_pro .

          echo "=== 還原 lib/main.dart ==="
          cp /tmp/main.dart.bak lib/main.dart

          echo "=== 確認 android 骨架已建立 ==="
          ls -la android/
          ls -la android/app/
          echo "=== build.gradle 是否存在 ==="
          cat android/app/build.gradle
          echo "=== settings.gradle 是否存在 ==="
          cat android/settings.gradle

      - name: Add Widget and Custom Files
        script: |
          set -e
          
          # =========================================================
          # 1. 修改 AndroidManifest.xml 加入權限與 Receiver
          # =========================================================
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          echo "=== 原始 AndroidManifest.xml ==="
          cat "$MANIFEST"

          # 加入日曆權限（如果還沒有）
          if ! grep -q "READ_CALENDAR" "$MANIFEST"; then
            # 在 <manifest ...> 標籤後插入權限
            sed -i.bak 's|<manifest|<manifest|' "$MANIFEST"
            # 使用 python 更可靠地插入權限
            python3 -c "
import re
with open('$MANIFEST', 'r') as f:
    content = f.read()
if 'READ_CALENDAR' not in content:
    # 在 <application 之前插入權限
    content = content.replace(
        '<application',
        '    <uses-permission android:name=\"android.permission.READ_CALENDAR\" />\n    <uses-permission android:name=\"android.permission.WRITE_CALENDAR\" />\n\n    <application',
        1
    )
with open('$MANIFEST', 'w') as f:
    f.write(content)
print('權限已加入')
"
          fi

          # 加入 Receiver（如果還沒有）
          if ! grep -q "RosterWidgetProvider" "$MANIFEST"; then
            python3 -c "
with open('$MANIFEST', 'r') as f:
    content = f.read()
receiver = '''        <receiver android:name=\".RosterWidgetProvider\" android:exported=\"false\">
            <intent-filter>
                <action android:name=\"android.appwidget.action.APPWIDGET_UPDATE\" />
                <action android:name=\"PREV_MONTH\" />
                <action android:name=\"NEXT_MONTH\" />
                <action android:name=\"REFRESH_WIDGET\" />
            </intent-filter>
            <meta-data android:name=\"android.appwidget.provider\" android:resource=\"@xml/widget_info\" />
        </receiver>
    </application>'''
    content = content.replace('</application>', receiver, 1)
with open('$MANIFEST', 'w') as f:
    f.write(content)
print('Receiver 已加入')
"
          fi

          # 清理備份
          rm -f "${MANIFEST}.bak"
          echo "=== 最終 AndroidManifest.xml ==="
          cat "$MANIFEST"

          # =========================================================
          # 2. 重寫 MainActivity.kt (v2 版本，加入日曆方法)
          # =========================================================
          PKG_PATH="android/app/src/main/kotlin/com/example/roster_pro"
          mkdir -p "$PKG_PATH"
          # 刪除所有舊 MainActivity
          find android/app/src/main -name "MainActivity.kt" -delete || true
          find android/app/src/main -name "MainActivity.java" -delete || true

          cat > "$PKG_PATH/MainActivity.kt" <<'KT'
          package com.example.roster_pro

          import android.Manifest
          import android.content.pm.PackageManager
          import android.provider.CalendarContract
          import androidx.core.content.ContextCompat
          import io.flutter.embedding.android.FlutterActivity
          import io.flutter.embedding.engine.FlutterEngine
          import io.flutter.plugin.common.MethodChannel

          class MainActivity : FlutterActivity() {
              private val CHANNEL = "com.roster/calendar_real"
              override fun configureFlutterEngine(flutterEngine: FlutterEngine) {
                  super.configureFlutterEngine(flutterEngine)
                  MethodChannel(flutterEngine.dartExecutor.binaryMessenger, CHANNEL).setMethodCallHandler { call, result ->
                      if (call.method == "getCalendars") {
                          if (ContextCompat.checkSelfPermission(this, Manifest.permission.READ_CALENDAR) != PackageManager.PERMISSION_GRANTED) {
                              result.error("PERMISSION", "No calendar permission", null)
                              return@setMethodCallHandler
                          }
                          val calendars = mutableListOf<Map<String, Any?>>()
                          val uri = CalendarContract.Calendars.CONTENT_URI
                          val projection = arrayOf(
                              CalendarContract.Calendars._ID,
                              CalendarContract.Calendars.CALENDAR_DISPLAY_NAME,
                              CalendarContract.Calendars.ACCOUNT_NAME,
                              CalendarContract.Calendars.ACCOUNT_TYPE
                          )
                          val cursor = contentResolver.query(uri, projection, null, null, null)
                          cursor?.use {
                              while (it.moveToNext()) {
                                  val id = it.getLong(0).toString()
                                  val displayName = it.getString(1) ?: "Unnamed"
                                  val accountName = it.getString(2) ?: ""
                                  val accountType = it.getString(3) ?: ""
                                  val isGoogle = accountName.contains("gmail") || accountType.contains("google") || accountName.contains("google")
                                  calendars.add(mapOf(
                                      "id" to id,
                                      "displayName" to displayName,
                                      "accountName" to accountName,
                                      "accountType" to accountType,
                                      "isGoogle" to isGoogle
                                  ))
                              }
                          }
                          result.success(calendars)
                      } else {
                          result.notImplemented()
                      }
                  }
              }
          }
          KT
          echo "MainActivity.kt (v2) 建立完成"

          # =========================================================
          # 3. widget_info.xml
          # =========================================================
          mkdir -p android/app/src/main/res/xml
          cat > android/app/src/main/res/xml/widget_info.xml <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <appwidget-provider xmlns:android="http://schemas.android.com/apk/res/android"
              android:minWidth="250dp"
              android:minHeight="250dp"
              android:updatePeriodMillis="1800000"
              android:initialLayout="@layout/widget_layout"
