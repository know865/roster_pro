workflows:
  android-roster-pro-v74-widgetfix:
    name: Roster Pro v7.4 - Android APK (Widget & Calendar Fix)
    max_build_duration: 60
    instance_type: mac_mini_m1
    environment:
      flutter: 3.24.5
      java: 17
      groups:
        - keystore_credentials
    scripts:
      - name: Set up Flutter
        script: |
          flutter --version
          flutter clean
          flutter pub get

      - name: Rebuild Android Skeleton
        script: |
          cp lib/main.dart /tmp/main.dart.bak
          cp pubspec.yaml /tmp/pubspec.yaml.bak
          rm -rf android
          flutter create --platforms=android --org com.example --project-name roster_pro --no-pub .
          cp /tmp/main.dart.bak lib/main.dart
          cp /tmp/pubspec.yaml.bak pubspec.yaml
          ls -la android/build.gradle

      - name: Add Custom Widget Files
        script: |
          set -e

          # ============ AndroidManifest.xml（含多個 activity-alias 用於切換圖標）============
          cat > android/app/src/main/AndroidManifest.xml <<'MANIFEST_EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET"/>
              <uses-permission android:name="android.permission.READ_CALENDAR" />
              <uses-permission android:name="android.permission.WRITE_CALENDAR" />
              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" />
              <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" />
              <uses-permission android:name="android.permission.MANAGE_EXTERNAL_STORAGE" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.SET_WALLPAPER" />

              <application
                  android:label="Roster Pro"
                  android:name="${applicationName}"
                  android:icon="@mipmap/ic_launcher"
                  android:requestLegacyExternalStorage="true">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTop"
                      android:theme="@style/LaunchTheme"
                      android:configChanges="orientation|keyboardHidden|keyboard|screenSize|smallestScreenSize|locale|layoutDirection|fontScale|screenLayout|density|uiMode"
                      android:hardwareAccelerated="true"
                      android:windowSoftInputMode="adjustResize">
                      <meta-data android:name="io.flutter.embedding.android.NormalTheme" android:resource="@style/NormalTheme" />
                  </activity>

                  <!-- App 圖標切換用的 alias（只保留一個 enabled） -->
                  <activity-alias
                      android:name=".IconDefault"
                      android:enabled="true"
                      android:exported="true"
                      android:icon="@mipmap/ic_launcher"
                      android:label="Roster Pro"
                      android:targetActivity=".MainActivity">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity-alias>

                  <activity-alias
                      android:name=".IconAlt1"
                      android:enabled="false"
                      android:exported="true"
                      android:icon="@drawable/ic_launcher_alt1"
                      android:label="Roster Pro"
                      android:targetActivity=".MainActivity">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity-alias>

                  <activity-alias
                      android:name=".IconAlt2"
                      android:enabled="false"
                      android:exported="true"
                      android:icon="@drawable/ic_launcher_alt2"
                      android:label="Roster Pro"
                      android:targetActivity=".MainActivity">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity-alias>

                  <activity-alias
                      android:name=".IconAlt3"
                      android:enabled="false"
                      android:exported="true"
                      android:icon="@drawable/ic_launcher_alt3"
                      android:label="Roster Pro"
                      android:targetActivity=".MainActivity">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity-alias>

                  <activity-alias
                      android:name=".IconAlt4"
                      android:enabled="false"
                      android:exported="true"
                      android:icon="@drawable/ic_launcher_alt4"
                      android:label="Roster Pro"
                      android:targetActivity=".MainActivity">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity-alias>

                  <meta-data android:name="flutterEmbedding" android:value="2" />
                  <receiver android:name=".RosterWidgetProvider" android:exported="true" android:label="Roster Pro 月曆">
                      <intent-filter>
                          <action android:name="android.appwidget.action.APPWIDGET_UPDATE" />
                          <action android:name="PREV_MONTH" />
                          <action android:name="NEXT_MONTH" />
                          <action android:name="REFRESH_WIDGET" />
                      </intent-filter>
                      <meta-data android:name="android.appwidget.provider" android:resource="@xml/widget_info" />
                  </receiver>
              </application>
              <queries>
                  <intent>
                      <action android:name="android.intent.action.PROCESS_TEXT"/>
                      <data android:mimeType="text/plain"/>
                  </intent>
              </queries>
          </manifest>
          MANIFEST_EOF

          # ============ MainActivity.kt（含切換圖標方法）============
          mkdir -p android/app/src/main/kotlin/com/example/roster_pro
          cat > android/app/src/main/kotlin/com/example/roster_pro/MainActivity.kt <<'MAIN_EOF'
          package com.example.roster_pro

          import android.Manifest
          import android.content.ComponentName
          import android.content.ContentUris
          import android.content.Intent
          import android.content.pm.PackageManager
          import android.media.MediaScannerConnection
          import android.net.Uri
          import android.os.Build
          import android.os.Environment
          import android.provider.CalendarContract
          import android.provider.Settings
          import androidx.core.content.ContextCompat
          import io.flutter.embedding.android.FlutterActivity
          import io.flutter.embedding.engine.FlutterEngine
          import io.flutter.plugin.common.MethodChannel
          import java.io.File

          class MainActivity : FlutterActivity() {
              private val CHANNEL = "com.roster/calendar_real"

              override fun configureFlutterEngine(flutterEngine: FlutterEngine) {
                  super.configureFlutterEngine(flutterEngine)
                  MethodChannel(flutterEngine.dartExecutor.binaryMessenger, CHANNEL).setMethodCallHandler { call, result ->
                      when (call.method) {
                          "getCalendars" -> handleGetCalendars(result)
                          "scanImage" -> handleScanImage(call.argument<String>("path"), result)
                          "requestManageStorage" -> handleRequestManageStorage(result)
                          "switchIcon" -> {
                              val index = call.argument<Int>("index") ?: 0
                              handleSwitchIcon(index, result)
                          }
                          "deleteAllEventsInCalendar" -> {
                              val calendarId = call.argument<String>("calendarId")
                              if (calendarId == null) {
                                  result.error("NO_CAL_ID", "Calendar ID is null", null)
                              } else {
                                  handleDeleteAllEvents(calendarId, result)
                              }
                          }
                          else -> result.notImplemented()
                      }
                  }
              }

              private fun handleSwitchIcon(index: Int, result: MethodChannel.Result) {
                  val aliases = arrayOf(
                      "$packageName.IconDefault",
                      "$packageName.IconAlt1",
                      "$packageName.IconAlt2",
                      "$packageName.IconAlt3",
                      "$packageName.IconAlt4"
                  )
                  if (index < 0 || index >= aliases.size) {
                      result.error("INVALID_INDEX", "Index out of range: $index", null)
                      return
                  }
                  try {
                      for (i in aliases.indices) {
                          val state = if (i == index)
                              PackageManager.COMPONENT_ENABLED_STATE_ENABLED
                          else
                              PackageManager.COMPONENT_ENABLED_STATE_DISABLED
                          packageManager.setComponentEnabledSetting(
                              ComponentName(packageName, aliases[i]),
                              state,
                              PackageManager.DONT_KILL_APP
                          )
                      }
                      result.success(true)
                  } catch (e: Exception) {
                      result.error("SWITCH_FAIL", e.message, null)
                  }
              }

              private fun handleGetCalendars(result: MethodChannel.Result) {
                  if (ContextCompat.checkSelfPermission(this, Manifest.permission.READ_CALENDAR) != PackageManager.PERMISSION_GRANTED) {
                      result.error("PERMISSION", "No calendar permission", null)
                      return
                  }
                  val calendars = mutableListOf<Map<String, Any?>>()
                  val uri = CalendarContract.Calendars.CONTENT_URI
                  val projection = arrayOf(
                      CalendarContract.Calendars._ID,
                      CalendarContract.Calendars.CALENDAR_DISPLAY_NAME,
                      CalendarContract.Calendars.ACCOUNT_NAME,
                      CalendarContract.Calendars.ACCOUNT_TYPE
                  )
                  val cursor = contentResolver.query(uri, projection, null, null, null)
                  cursor?.use {
                      while (it.moveToNext()) {
                          val id = it.getLong(0).toString()
                          val displayName = it.getString(1) ?: "Unnamed"
                          val accountName = it.getString(2) ?: ""
                          val accountType = it.getString(3) ?: ""
                          val isGoogle = accountName.contains("gmail") || accountType.contains("google") || accountName.contains("google")
                          calendars.add(mapOf(
                              "id" to id,
                              "displayName" to displayName,
                              "accountName" to accountName,
                              "accountType" to accountType,
                              "isGoogle" to isGoogle
                          ))
                      }
                  }
                  result.success(calendars)
              }

              private fun handleScanImage(path: String?, result: MethodChannel.Result) {
                  if (path == null) { result.error("NO_PATH", "Path is null", null); return }
                  try {
                      val file = File(path)
                      if (!file.exists()) { result.error("NO_FILE", "File does not exist: $path", null); return }
                      MediaScannerConnection.scanFile(applicationContext, arrayOf(file.absolutePath), arrayOf("image/jpeg", "image/jpg", "image/png")) { _, uri -> result.success(uri?.toString() ?: path) }
                  } catch (e: Exception) { result.error("SCAN_FAIL", e.message, null) }
              }

              private fun handleRequestManageStorage(result: MethodChannel.Result) {
                  try {
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.R) {
                          if (!Environment.isExternalStorageManager()) {
                              val intent = Intent(Settings.ACTION_MANAGE_APP_ALL_FILES_ACCESS_PERMISSION)
                              intent.data = Uri.parse("package:$packageName")
                              startActivity(intent)
                              result.success(false)
                              return
                          }
                          result.success(true)
                      } else { result.success(true) }
                  } catch (e: Exception) { result.error("STORAGE_FAIL", e.message, null) }
              }

              private fun handleDeleteAllEvents(calendarId: String, result: MethodChannel.Result) {
                  try {
                      if (ContextCompat.checkSelfPermission(this, Manifest.permission.WRITE_CALENDAR) != PackageManager.PERMISSION_GRANTED) {
                          result.error("PERMISSION", "No write calendar permission", null)
                          return
                      }
                      val uri = CalendarContract.Events.CONTENT_URI
                      val projection = arrayOf(CalendarContract.Events._ID)
                      val selection = "${CalendarContract.Events.CALENDAR_ID} = ?"
                      val selectionArgs = arrayOf(calendarId)
                      val cursor = contentResolver.query(uri, projection, selection, selectionArgs, null)
                      val eventIds = mutableListOf<Long>()
                      cursor?.use {
                          while (it.moveToNext()) {
                              eventIds.add(it.getLong(0))
                          }
                      }
                      val batchSize = 10
                      var deleted = 0
                      var index = 0
                      while (index < eventIds.size) {
                          val end = minOf(index + batchSize, eventIds.size)
                          for (i in index until end) {
                              val eventUri = ContentUris.withAppendedId(CalendarContract.Events.CONTENT_URI, eventIds[i])
                              try {
                                  contentResolver.delete(eventUri, null, null)
                                  deleted++
                              } catch (e: Exception) {
                              }
                          }
                          index = end
                          if (index < eventIds.size) {
                              try { Thread.sleep(200) } catch (_: InterruptedException) {}
                          }
                      }
                      result.success(deleted)
                  } catch (e: Exception) {
                      result.error("DELETE_FAIL", e.message, null)
                  }
              }
          }
          MAIN_EOF

          # ============ DateTimeUtils.kt ============
          cat > android/app/src/main/kotlin/com/example/roster_pro/DateTimeUtils.kt <<'DATETIME_EOF'
          package com.example.roster_pro

          import java.util.Calendar

          object DateTimeUtils {
              fun getDateOfIndex(year: Int, month: Int, index: Int, startOffset: Int): java.util.Date? {
                  return try {
                      val dayIndex = index - startOffset + 1
                      val cal = Calendar.getInstance()
                      cal.set(year, month, dayIndex)
                      cal.time
                  } catch (e: Exception) {
                      null
                  }
              }
          }
          DATETIME_EOF

          # ============ widget_info.xml ============
