workflows:
  android-roster-pro-v71-9fix:
    name: Roster Pro v7.1 9Fix - Android APK
    max_build_duration: 60
    instance_type: mac_mini_m1
    environment:
      flutter: 3.24.5
      java: 17
      groups:
        - keystore_credentials  # 如果無keystore可刪此行，用debug簽名
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
    scripts:
      - name: Set up Flutter
        script: |
          flutter --version
          flutter clean
          flutter pub get

      - name: Fix Android MainActivity for Real Calendar ID + Widget 4x4
        script: |
          # 1. 確保 MainActivity.kt 有 getCalendars 真ID方法 (Fix 日曆空白 0個問題)
          MAIN_KT=$(find android/app/src/main/kotlin -name "MainActivity.kt" | head -n 1)
          if [ -n "$MAIN_KT" ]; then
          cat > "$MAIN_KT" <<'KT'
          package com.example.roster_pro

          import android.Manifest
          import android.content.pm.PackageManager
          import android.provider.CalendarContract
          import androidx.core.content.ContextCompat
          import io.flutter.embedding.android.FlutterActivity
          import io.flutter.embedding.engine.FlutterEngine
          import io.flutter.plugin.common.MethodChannel

          class MainActivity: FlutterActivity() {
              private val CHANNEL = "com.roster/calendar_real"
              override fun configureFlutterEngine(flutterEngine: FlutterEngine) {
                  super.configureFlutterEngine(flutterEngine)
                  MethodChannel(flutterEngine.dartExecutor.binaryMessenger, CHANNEL).setMethodCallHandler { call, result ->
                      if (call.method == "getCalendars") {
                          if (ContextCompat.checkSelfPermission(this, Manifest.permission.READ_CALENDAR) != PackageManager.PERMISSION_GRANTED) {
                              result.error("PERMISSION", "No calendar permission", null)
                              return@setMethodCallHandler
                          }
                          val calendars = mutableListOf<Map<String, Any?>>()
                          val uri = CalendarContract.Calendars.CONTENT_URI
                          val projection = arrayOf(CalendarContract.Calendars._ID, CalendarContract.Calendars.CALENDAR_DISPLAY_NAME, CalendarContract.Calendars.ACCOUNT_NAME, CalendarContract.Calendars.ACCOUNT_TYPE)
                          val cursor = contentResolver.query(uri, projection, null, null, null)
                          cursor?.use {
                              while (it.moveToNext()) {
                                  val id = it.getLong(0).toString()
                                  val displayName = it.getString(1) ?: "Unnamed"
                                  val accountName = it.getString(2) ?: ""
                                  val accountType = it.getString(3) ?: ""
                                  val isGoogle = accountName.contains("gmail") || accountType.contains("google") || accountName.contains("google")
                                  calendars.add(mapOf("id" to id, "displayName" to displayName, "accountName" to accountName, "accountType" to accountType, "isGoogle" to isGoogle))
                              }
                          }
                          result.success(calendars)
                      } else {
                          result.notImplemented()
                      }
                  }
              }
          }
          KT
          echo "MainActivity.kt patched for real calendar ID"
          fi

          # 2. 確保 Widget 4x4 有 focused_month + month_data + 選中日顯示詳細 (Fix5 Widget空白)
          mkdir -p android/app/src/main/res/layout
          cat > android/app/src/main/res/layout/widget_layout.xml <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:orientation="vertical"
              android:background="#FFFFFF"
              android:padding="8dp">
              <LinearLayout android:layout_width="match_parent" android:layout_height="wrap_content" android:orientation="horizontal">
                  <TextView android:id="@+id/widget_month" android:layout_width="0dp" android:layout_weight="1" android:layout_height="wrap_content" android:text="2026年5月" android:textStyle="bold" android:textSize="14sp"/>
                  <TextView android:id="@+id/widget_prev" android:layout_width="32dp" android:layout_height="32dp" android:text="&lt;" android:gravity="center" android:background="#EEEEEE"/>
                  <TextView android:id="@+id/widget_next" android:layout_width="32dp" android:layout_height="32dp" android:text="&gt;" android:gravity="center" android:background="#EEEEEE" android:layout_marginStart="4dp"/>
              </LinearLayout>
              <TextView android:id="@+id/widget_today" android:layout_width="match_parent" android:layout_height="wrap_content" android:text="今天: O" android:textSize="12sp" android:layout_marginTop="4dp"/>
              <TextView android:id="@+id/widget_selected" android:layout_width="match_parent" android:layout_height="wrap_content" android:text="選中: 無" android:textSize="11sp" android:textColor="#673AB7" android:fontFamily="monospace" android:maxLines="3"/>
              <GridLayout android:id="@+id/widget_grid" android:layout_width="match_parent" android:layout_height="0dp" android:layout_weight="1" android:columnCount="7" android:rowCount="6" android:layout_marginTop="4dp"/>
          </LinearLayout>
          XML

          mkdir -p android/app/src/main/kotlin/com/example/roster_pro
          cat > android/app/src/main/kotlin/com/example/roster_pro/RosterWidgetProvider.kt <<'KT'
          package com.example.roster_pro

          import android.app.PendingIntent
          import android.appwidget.AppWidgetManager
          import android.content.Context
          import android.content.Intent
          import android.widget.RemoteViews
          import es.antonborri.home_widget.HomeWidgetLaunchIntent
          import es.antonborri.home_widget.HomeWidgetProvider

          class RosterWidgetProvider : HomeWidgetProvider() {
              override fun onUpdate(context: Context, appWidgetManager: AppWidgetManager, appWidgetIds: IntArray, widgetData: android.content.SharedPreferences) {
                  appWidgetIds.forEach { widgetId ->
                      val views = RemoteViews(context.packageName, R.layout.widget_layout).apply {
                          val month = widgetData.getString("focused_month", "") ?: ""
                          val monthDataStr = widgetData.getString("month_data", "") ?: ""
                          val todayCode = widgetData.getString("today_code", "O") ?: "O"
                          val selectedDay = widgetData.getString("selected_day", "") ?: ""
                          val note = widgetData.getString("note", "") ?: ""
                          setTextViewText(R.id.widget_month, if(month.isNotEmpty()) month.replace("-", "年")+"月" else "排更月曆")
                          setTextViewText(R.id.widget_today, "今天: $todayCode ${if(note.isNotEmpty()) "| $note" else ""}")
                          setTextViewText(R.id.widget_selected, "選中: $selectedDay")
                          // Grid簡化顯示 1:早 2:O...
                          removeAllViews(R.id.widget_grid)
                          // 點擊打開App顯示詳細
                          val launchIntent = HomeWidgetLaunchIntent.getActivity(context, MainActivity::class.java)
                          setOnClickPendingIntent(R.id.widget_layout_root, PendingIntent.getActivity(context, 0, launchIntent, PendingIntent.FLAG_UPDATE_CURRENT or PendingIntent.FLAG_IMMUTABLE))
                          // 上下月按鈕
                          val prevIntent = Intent(context, RosterWidgetProvider::class.java).apply { action = "PREV_MONTH" }
                          val nextIntent = Intent(context, RosterWidgetProvider::class.java).apply { action = "NEXT_MONTH" }
                          setOnClickPendingIntent(R.id.widget_prev, PendingIntent.getBroadcast(context, 1, prevIntent, PendingIntent.FLAG_UPDATE_CURRENT or PendingIntent.FLAG_IMMUTABLE))
                          setOnClickPendingIntent(R.id.widget_next, PendingIntent.getBroadcast(context, 2, nextIntent, PendingIntent.FLAG_UPDATE_CURRENT or PendingIntent.FLAG_IMMUTABLE))
                      }
                      appWidgetManager.updateAppWidget(widgetId, views)
                  }
              }
          }
          KT
          echo "Widget 4x4 patched - Fix5"

          # 3. AndroidManifest 確保有日曆權限和Widget receiver
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if grep -q "READ_CALENDAR" "$MANIFEST"; then echo "Calendar permission exists"; else
            sed -i '' 's/<manifest/<manifest xmlns:tools="http:\/\/schemas.android.com\/tools"/' "$MANIFEST" 2>/dev/null || sed -i 's/<manifest/<manifest xmlns:tools="http:\/\/schemas.android.com\/tools"/' "$MANIFEST"
            sed -i '' '/<application/i\
              <uses-permission android:name="android.permission.READ_CALENDAR" />\
              <uses-permission android:name="android.permission.WRITE_CALENDAR" />\
          ' "$MANIFEST" 2>/dev/null || sed -i '/<application/i <uses-permission android:name="android.permission.READ_CALENDAR" />\n    <uses-permission android:name="android.permission.WRITE_CALENDAR" />\n' "$MANIFEST"
          fi
          cat "$MANIFEST"

      - name: Build APK Release 9Fix
        script: |
          flutter build apk --release --no-tree-shake-icons --build-name=7.1.9 --build-number=71
          ls -lh build/app/outputs/flutter-apk/

    artifacts:
      - build/app/outputs/flutter-apk/app-release.apk
      - build/app/outputs/flutter-apk/app-release.apk.sha1
      - flutter_*.log

    publishing:
      email:
        recipients:
          - know865@gmail.com
        notify:
          success: true
          failure: true
