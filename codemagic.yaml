workflows:
  roster-pro-v2:
    name: Roster Pro V2
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      flutter: 3.24.5
      groups:
        - codemagic
    scripts:
      - name: Create project if missing
        script: |
          if [ ! -d "android" ]; then
            flutter create . --project-name roster_pro --platforms=android
          fi
      - name: Patch Android Gradle
        script: |
          sed -i '' 's/compileSdkVersion.*/compileSdkVersion 34/' android/app/build.gradle || true
          sed -i '' 's/compileSdk .*/compileSdk 34/' android/app/build.gradle || true
          sed -i '' 's/minSdkVersion.*/minSdkVersion 21/' android/app/build.gradle || true
          sed -i '' 's/minSdk .*/minSdk 21/' android/app/build.gradle || true
          echo "Patched"
      - name: Get packages
        script: flutter pub get
      - name: Build APK
        script: |
          flutter build apk --release --verbose
    artifacts:
      - build/app/outputs/flutter-apk/*.apk
      - build/**/outputs/apk/**/*.apk
